# Long video "5 Moments in History That Sound Fake". Runs only on the history-5 branch. Nothing is uploaded.
name: History 5 long video

on:
  push:
    branches: [history-5]
    paths:
      - "tools/history5_*.py"
      - "scripts/queue/_history5.json"
      - ".github/workflows/history5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history5
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Free disk space (a long render needs room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / && free -h
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji libraqm0 fontconfig
      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch faster-whisper
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--laion--CLIP-ViT-B-32-laion2B-s34B-b79K
          key: clip-models-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-small.en
          key: whisper-small-en-v1
      - name: Reuse voice parts already made (never pay twice)
        run: |
          mkdir -p assets/history5/parts
          if git fetch -q origin +refs/heads/history5-voice:refs/remotes/origin/history5-voice 2>/dev/null; then
            for f in $(git ls-tree --name-only origin/history5-voice | grep -E '^p[0-9]+\.mp3$'); do
              git show "origin/history5-voice:$f" > "assets/history5/parts/$f"
            done
          fi
          ls -la assets/history5/parts
      - name: Make the ElevenLabs v3 voice (checks the balance first)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python tools/history5_voice.py
      - name: Keep the voice parts on branch history5-voice
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(assets/history5/parts/p*.mp3 assets/history5/voice_report.json)
          [ ${#files[@]} -eq 0 ] && { echo "No voice parts"; exit 0; }
          mkdir -p /tmp/voice && cp "${files[@]}" /tmp/voice/
          cd /tmp/voice
          git init -q -b history5-voice
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "History 5 voice parts from run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" history5-voice
      - name: Render 16:9 (no upload, no ElevenLabs key)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          STUDIO_QC_STRICT: "0"
          STUDIO_EXPORT_SOURCES: "1"
        run: |
          ( while true; do sleep 300; echo "[watch] $(df -h / | tail -1 | awk '{print $4}') disk free, $(free -m | awk '/Mem/{print $7}') MB memory free"; done ) &
          python -m studio.main --file scripts/queue/_history5.json --no-upload
      - name: Save the video (Actions artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history5-${{ github.run_number }}
          compression-level: 0
          path: |
            output/
            work/_history5/plan.json
            assets/history5/voice_report.json
          retention-days: 7
          if-no-files-found: ignore
