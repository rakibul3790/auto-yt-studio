# One-off PUBLIC upload of a video the channel owner approved by hand.
# Runs only on the pro-shorts branch when a publish-public/*.json is pushed; a JSON that
# already has "url" is skipped, so nothing is uploaded twice. The daily pipeline is untouched.
name: Publish approved video (public)

on:
  push:
    branches: [pro-shorts]
    paths:
      - "publish-public/*.json"

permissions:
  contents: write

concurrency:
  group: publish-public
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Get the approved video from the source files
        run: |
          git fetch -q --depth=1 origin pro-sources
          mkdir -p /tmp/pub && cd /tmp/pub
          for f in $(git -C "$GITHUB_WORKSPACE" ls-tree --name-only FETCH_HEAD); do
            git -C "$GITHUB_WORKSPACE" show "FETCH_HEAD:$f" > "$f"
          done
          cat mariana-pro-short-sources.zip.part* > mariana-pro-short-sources.zip
          sha256sum -c SHA256SUMS.txt
          unzip -q -o mariana-pro-short-sources.zip 01_final_with_captions.mp4

      - name: Upload to YouTube as Public
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/publish_public.py publish-public/mariana-trench.json /tmp/pub/01_final_with_captions.mp4

      - name: Save the YouTube link
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish-public
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Published approved video [skip ci]"
          git pull --rebase --autostash origin pro-shorts
          git push origin HEAD:pro-shorts
