name: ref-download
on:
  push:
    branches: [ref-analysis]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download reference short
        run: |
          python3 -m pip install -q -U yt-dlp
          mkdir -p ref
          URL="https://www.youtube.com/shorts/pBQ8QfqjrD8"
          for C in "default" "tv" "web_safari" "android" "ios" "mweb"; do
            if [ "$C" = "default" ]; then EA=""; else EA="--extractor-args youtube:player_client=$C"; fi
            echo "== client $C"
            yt-dlp $EA -f "bv*[height<=1920]+ba/b" --merge-output-format mp4 -o "ref/ref.%(ext)s" --write-info-json "$URL" && break
          done
          ls -la ref
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ref || true
          git commit -m "ref download [skip ci]" || echo nothing
          git push origin HEAD:ref-analysis
