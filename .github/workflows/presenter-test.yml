# Presenter Short test: only downloads the card photos and clips (Pixabay, free
# licence) into presenter/out/media. The video itself is drawn off GitHub, so this
# run stays a few minutes long. Free Edge voice only, never uploads, never uses ElevenLabs.
name: Presenter Short media

on:
  push:
    branches: [presenter-test]
    paths:
      - "presenter/media-request"

permissions:
  contents: write

concurrency:
  group: presenter-test
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install Python packages
        run: pip install -q requests Pillow numpy PyYAML
      - name: Card photos and clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m presenter.build media
      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add presenter/out/media
          git commit -m "presenter: card media [skip ci]" || true
          git pull --rebase origin presenter-test || true
          git push origin HEAD:presenter-test
