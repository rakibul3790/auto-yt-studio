# Test render of the "presenter" Short: an AI-made host talking to camera
# (SadTalker lip sync), with floating cards, map motion graphics and sound design.
# Free Edge voice only, never uploads, never uses ElevenLabs.
# Runs only on the presenter-test branch; results go to presenter/out on that branch.
name: Presenter Short test

on:
  push:
    branches: [presenter-test]
    paths:
      - "presenter/script.json"
      - "presenter/build.py"
      - "presenter/redo"
      - ".github/workflows/presenter-test.yml"

permissions:
  contents: write

concurrency:
  group: presenter-test
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji libraqm0 fontconfig

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install "rembg[cpu]==2.0.59" || pip install rembg onnxruntime

      - name: Sharper NASA Blue Marble map for this run
        timeout-minutes: 6
        continue-on-error: true
        run: |
          for u in \
            https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73909/world.topo.bathy.200412.3x5400x2700.jpg \
            https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74042/world.topo.bathy.200412.3x5400x2700.jpg; do
            if curl -fsSL --connect-timeout 20 --max-time 120 --retry 2 -o /tmp/bm.jpg "$u"; then
              python -c "from PIL import Image; im=Image.open('/tmp/bm.jpg'); assert im.width>=5000; print(im.size)" \
                && cp /tmp/bm.jpg assets/map/blue-marble.jpg && break
            fi
          done

      - name: Voice, host picture, bird cutouts
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m presenter.build prep

      - name: Save voice and host picture
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add presenter/out
          git commit -m "presenter: voice and host [skip ci]" || true
          git push origin HEAD:presenter-test || true

      - name: Keep SadTalker models between runs
        id: stcache
        if: hashFiles('presenter/out/talk.mp4') == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/SadTalker/checkpoints
            /tmp/SadTalker/gfpgan/weights
          key: sadtalker-models-v1

      - name: Talking host (SadTalker, free and open source)
        if: hashFiles('presenter/out/talk.mp4') == ''
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          [ -d /tmp/SadTalker/.git ] || { mkdir -p /tmp/st_src && git clone --depth 1 https://github.com/OpenTalker/SadTalker /tmp/st_src \
            && cp -rn /tmp/st_src/. /tmp/SadTalker/; }
          cd /tmp/SadTalker
          python -m venv /tmp/stenv
          . /tmp/stenv/bin/activate
          pip install -q --upgrade pip wheel
          pip install -q "setuptools<70"
          pip install -q torch==2.1.2 torchvision==0.16.2 torchaudio==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy==1.23.5
          pip install -q --no-build-isolation basicsr==1.4.2
          pip install -q face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 resampy==0.3.1 \
            pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 scikit-image==0.19.3 \
            facexlib==0.3.0 gfpgan==1.3.8 av safetensors opencv-python==4.8.1.78 "numba<0.59" numpy==1.23.5
          python -c "import pkg_resources, librosa, basicsr, gfpgan, facexlib, face_alignment, kornia, safetensors, cv2, av; print('imports ok')"
          if [ ! -f checkpoints/SadTalker_V0.0.2_256.safetensors ] || [ ! -f gfpgan/weights/parsing_parsenet.pth ]; then
            sed -i -e '/_512/d' -e 's/wget -nc/wget -nc -q --timeout=60 --tries=5/' scripts/download_models.sh
            timeout 20m bash scripts/download_models.sh
          fi
          ls -la checkpoints gfpgan/weights || true
          start=$(date +%s)
          timeout 150m python inference.py --driven_audio "$GITHUB_WORKSPACE/presenter/out/voice16k.wav" \
            --source_image "$GITHUB_WORKSPACE/presenter/out/presenter.png" \
            --result_dir /tmp/st_out --still --preprocess full --size 256 --cpu
          echo "SadTalker took $(( $(date +%s) - start )) s"
          f=$(ls -t $(find /tmp/st_out -name '*.mp4') | head -1)
          ffmpeg -y -loglevel error -i "$f" -an -c:v libx264 -crf 17 -preset medium -pix_fmt yuv420p \
            "$GITHUB_WORKSPACE/presenter/out/talk.mp4"

      - name: Save SadTalker models for next time
        if: always() && steps.stcache.conclusion == 'success' && steps.stcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/SadTalker/checkpoints
            /tmp/SadTalker/gfpgan/weights
          key: sadtalker-models-v1

      - name: Save talking host
        if: always()
        run: |
          git add presenter/out || true
          git commit -m "presenter: talking host [skip ci]" || true
          git pull --rebase origin presenter-test || true
          git push origin HEAD:presenter-test || true

      - name: Draw the Short
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m presenter.build compose

      - name: Save the Short
        if: always()
        run: |
          git add presenter/out || true
          git commit -m "presenter: test render [skip ci]" || true
          git pull --rebase origin presenter-test || true
          git push origin HEAD:presenter-test
