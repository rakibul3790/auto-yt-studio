# Test render of the octopus Short from a ready-made voice. Runs only on the octopus-test branch.
# No ElevenLabs key and no YouTube keys are given to this job: nothing is paid for, nothing is uploaded.
name: Octopus test render

on:
  push:
    branches: [octopus-test]
    paths:
      - "scripts/queue/_octopus.json"
      - "tools/octopus_cache.py"
      - "studio/pro.py"
      - ".github/workflows/octopus-test.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji libraqm0 fontconfig
      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch faster-whisper
      - name: Keep the shot picker model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--laion--CLIP-ViT-B-32-laion2B-s34B-b79K
          key: clip-models-v1
      - name: Word times for the ready-made voice (free, no paid call)
        run: python tools/octopus_cache.py
      - name: Render (no upload)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m studio.main --file scripts/queue/_octopus.json --no-upload
      - name: Save the render on branch octopus-preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(output/*.mp4 output/*.qc.json)
          [ ${#files[@]} -eq 0 ] && { echo "Nothing rendered"; exit 0; }
          mkdir -p /tmp/prev && cp "${files[@]}" /tmp/prev/
          for d in work/*/; do [ -f "$d/plan.json" ] && cp "$d/plan.json" "/tmp/prev/$(basename "$d").plan.json"; done
          cd /tmp/prev
          git init -q -b octopus-preview
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Octopus test render from run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" octopus-preview
