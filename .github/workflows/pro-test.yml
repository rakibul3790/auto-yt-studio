# Test renders for the new "pro" Shorts style. Runs only on the pro-shorts
# branch, with the free Edge voices, and never uploads anything to YouTube.
# The finished test videos are saved in test-output/ on this branch.
name: Pro Shorts test

on:
  push:
    branches: [pro-shorts]
    paths:
      - "studio/**"
      - "scripts/pro-tests/**"
      - ".github/workflows/pro-test.yml"

permissions:
  contents: write                # to save the test videos on the pro-shorts branch

concurrency:
  group: pro-test
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji libraqm0 fontconfig

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install the AI shot picker (CLIP, free and open source)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch

      - name: Keep downloaded models between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-models-v1

      - name: Load the shot picker model once
        run: |
          python - <<'PY'
          import open_clip
          open_clip.create_model_and_transforms("ViT-B-32", pretrained="laion2b_s34b_b79k")
          print("CLIP ready")
          PY

      - name: Render test Shorts (no upload)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          STUDIO_QC_STRICT: "0"
          STUDIO_EXPORT_SOURCES: "1"
          # only used by a test script whose "test_voice" starts with elevenlabs: (spends credits)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          # each test script names its free Edge voice in "test_voice"
          for f in scripts/pro-tests/*.json; do
            v=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('test_voice','en-US-GuyNeural'))" "$f")
            [[ "$v" =~ ^en-[A-Z]{2}-[A-Za-z]+Neural$ || "$v" =~ ^elevenlabs:[A-Za-z0-9]{20}$ ]] || v=en-US-GuyNeural
            python -m studio.main --file "$f" --no-upload --voice "$v"
          done

      - name: Save the editing source files (branch pro-sources, zip in 45 MB parts)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          dirs=(output/*-sources)
          [ ${#dirs[@]} -eq 0 ] && { echo "No source folders"; exit 0; }
          mkdir -p /tmp/src
          for d in "${dirs[@]}"; do
            n=$(basename "$d")
            (cd "$d" && zip -qr -0 "/tmp/$n.zip" .)
            split -b 45m -d -a 2 "/tmp/$n.zip" "/tmp/src/$n.zip.part"
            (cd /tmp && sha256sum "$n.zip") >> /tmp/src/SHA256SUMS.txt
          done
          cd /tmp/src
          git init -q -b pro-sources
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Editing source files from ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5; do
            git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pro-sources && break
            [ $i -eq 5 ] && exit 1
            echo "Push failed, trying again"; sleep $((i * 15))
          done
          ls -la /tmp/src

      - name: Save the test videos on this branch
        if: always()
        run: |
          mkdir -p test-output
          cp output/*-short.mp4 output/*.qc.json test-output/ 2>/dev/null || true
          for d in work/*/; do n=$(basename "$d"); [ -f "$d/plan.json" ] && cp "$d/plan.json" "test-output/$n.plan.json"; done
          ls -la test-output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-output
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Pro Shorts test render ${GITHUB_SHA::7}"
          git pull --rebase --autostash
          git push
