# Makes the next video from scripts/queue/ and uploads it to YouTube (privacy from config.yaml).
# Started by cron-job.org 3 times a day; you can also run it any time from the Actions tab.
# Scheduled publishing (studio/slots.py): cron-job.org starts the runs at 1:00, 2:00 and 3:00 AM
# Bangladesh time with the input slot = 04:40, 05:40 or 06:40. Each run uploads Private with
# publishAt at its slot, and YouTube makes it Public then. A run with no slot at another time
# (or one whose slot has passed or is under 10 minutes away) uploads Public at once, as before.
# Runs may overlap: each run claims its own script first (studio/claim.py), so two runs never
# make the same video, and every save to the repo retries until it lands.
name: Daily video

on:
  # GitHub-এর নিজের টাইমার বন্ধ: ওটা অনেক দেরিতে চলত বা চলতই না। এখন cron-job.org
  # প্রতিদিন ৩ বার এই workflow চালায় (প্রতিবার ১টা ভিডিও)। config.yaml-এর
  # max_uploads_per_day দিনে ৩টার বেশি হতে দেয় না।
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to make now"
        default: "1"
      upload:
        description: "Upload to YouTube? (no = test only, download from Artifacts)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      voice:
        description: "Voice for this run only, e.g. Ava or Guy (empty = normal voice test)"
        default: ""
      file:
        description: "Make only this script, e.g. scripts/queue/_sample.json (empty = next in queue)"
        default: ""
      slot:
        description: "Publish slot, e.g. 04:40 (Bangladesh time), or now (empty = from the start time)"
        default: ""

permissions:
  contents: write                # to claim scripts and move finished ones to scripts/done/
  actions: read                  # to read when this run was started (its publish slot)

# no concurrency group on purpose: a second daily run must never be cancelled or held back
# behind the first one; the claim step keeps overlapping runs on different scripts

jobs:
  make-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          # always the newest queue of the branch it was started on (main for the daily runs),
          # so a queued second run never redoes a video; a test branch can be dry-run the same way
          ref: ${{ github.ref_name }}

      - name: When was this run started (for its publish slot)
        id: started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at 2>/dev/null || true)
          [[ "$t" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || t=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Run started at $t (UTC)"
          echo "at=$t" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts (English + Bengali)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji libraqm0 fontconfig espeak-ng
          fc-list | grep -E "NotoSans(Bengali)?-Bold" | head -2

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Claim the next script for this run (overlapping runs never share one)
        id: claim
        if: ${{ inputs.upload != 'no' && inputs.file == '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m studio.claim

      - name: Get the ElevenLabs library sound effects (only the missing ones, no credits)
        continue-on-error: true
        run: python tools/fetch_sfx.py

      - name: Keep downloaded voice models between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-models-v1

      - name: Install open-source voices (only when one is used)
        env:
          VOICE: ${{ inputs.voice }}
        run: |
          if grep -q "kokoro:" config.yaml || [[ "$VOICE" == *kokoro* ]]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install "kokoro>=0.9.4" soundfile
          fi
          if grep -q "chatterbox:" config.yaml || [[ "$VOICE" == *chatterbox* ]]; then
            pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            pip install chatterbox-tts soundfile
          fi

      - name: Install the AI shot picker (CLIP, free and open source)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch faster-whisper
          # subject detector for whole-subject framing (studio/framing.py)
          pip install "transformers>=4.45"

      - name: Keep the shot picker model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--laion--CLIP-ViT-B-32-laion2B-s34B-b79K
          key: clip-models-v1

      - name: Keep the word timing model between runs (free whisper, for the v3 voice)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-small.en
          key: whisper-small-en-v1

      - name: Keep the subject detector between runs (OWLv2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--google--owlv2-base-patch16-ensemble
          key: owlv2-base-ensemble-v1

      - name: Load the subject detector once
        continue-on-error: true
        run: |
          python - <<'PY'
          from transformers import Owlv2ForObjectDetection, Owlv2Processor
          Owlv2Processor.from_pretrained("google/owlv2-base-patch16-ensemble")
          Owlv2ForObjectDetection.from_pretrained("google/owlv2-base-patch16-ensemble")
          print("Subject detector ready")
          PY

      - name: Load the shot picker model once
        continue-on-error: true
        run: |
          python - <<'PY'
          import open_clip
          open_clip.create_model_and_transforms("ViT-B-32", pretrained="laion2b_s34b_b79k")
          print("CLIP ready")
          PY

      - name: Make and upload video
        if: ${{ steps.claim.outcome == 'skipped' || steps.claim.outputs.file != '' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COUNT: ${{ inputs.count }}
          UPLOAD: ${{ inputs.upload }}
          VOICE: ${{ inputs.voice }}
          FILE: ${{ inputs.file }}
          CLAIMED: ${{ steps.claim.outputs.file }}
          RUN_STARTED_AT: ${{ steps.started.outputs.at }}
          PUBLISH_SLOT: ${{ inputs.slot }}
        run: |
          args=()
          if [[ "$VOICE" =~ ^[A-Za-z0-9\ ():_-]+$ ]]; then args+=(--voice "$VOICE"); fi
          if [[ "$FILE" =~ ^scripts/queue/[A-Za-z0-9._-]+\.json$ ]]; then args+=(--file "$FILE"); fi
          if [[ "$CLAIMED" =~ ^scripts/working/[A-Za-z0-9._-]+\.json$ ]]; then args+=(--file "$CLAIMED"); fi
          if [[ "$COUNT" =~ ^[0-9]+$ ]]; then args+=(--count "$COUNT"); fi
          if [[ "$UPLOAD" == "no" ]]; then args+=(--no-upload); fi
          python -m studio.main "${args[@]}"

      - name: Save the video files (Actions → this run → Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save a test render for viewing (branch previews, only when upload = no)
        if: ${{ always() && inputs.upload == 'no' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(output/*.mp4 output/*.qc.json output/*.framecheck.jpg)
          [ ${#files[@]} -eq 0 ] && { echo "Nothing rendered"; exit 0; }
          mkdir -p /tmp/prev && cp "${files[@]}" /tmp/prev/
          for d in work/*/; do [ -f "$d/plan.json" ] && cp "$d/plan.json" "/tmp/prev/$(basename "$d").plan.json"; done
          # the paid voice read, so a re-render of the same script costs no new ElevenLabs credits
          for d in work/*/; do
            v=("$d"pro_*_whole.mp3)
            if [ -f "${v[0]}" ]; then
              mkdir -p "/tmp/prev/voice/$(basename "$d")"
              cp "$d"pro_*_whole.mp3 "$d"pro_*_whole.json "/tmp/prev/voice/$(basename "$d")/" 2>/dev/null || true
            fi
          done
          cd /tmp/prev
          git init -q -b previews
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Test render from run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previews
          ls -la

      - name: Move finished scripts to scripts/done
        if: always()
        env:
          CLAIMED: ${{ steps.claim.outputs.file }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a claimed script still in scripts/working (the run stopped early) goes back to the queue
          if [[ "$CLAIMED" =~ ^scripts/working/[A-Za-z0-9._-]+\.json$ ]] && [ -f "$CLAIMED" ]; then
            python -m studio.claim --release "$CLAIMED" || true
          fi
          git add -A scripts logs assets/sfx
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Uploaded video(s) from the queue"
          # another run may have saved in between: take its changes and try again until it lands
          branch="${GITHUB_REF_NAME}"
          for i in $(seq 1 15); do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Saved (try $i)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 8) + 3 ))
          done
          echo "::error title=Could not save the queue::the finished script could not be pushed after 15 tries"
          exit 1
