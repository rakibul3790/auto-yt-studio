# Makes the next video from scripts/queue/ and uploads it to YouTube as PRIVATE.
# Runs every day by itself; you can also run it any time from the Actions tab.
name: Daily video

on:
  schedule:
    # 10:30 UTC = বিকেল ৪:৩০ বাংলাদেশ সময়। ভিডিও Private আপলোড হয়, তাই এই সময়
    # শুধু ঠিক করে কখন দেখার জন্য রেডি পাবে। GitHub মাঝে মাঝে ১০–৩০ মিনিট দেরিতে চালায়।
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to make now"
        default: "1"
      upload:
        description: "Upload to YouTube? (no = test only, download from Artifacts)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
      voice:
        description: "Voice for this run only, e.g. Ava or Guy (empty = normal voice test)"
        default: ""
      file:
        description: "Make only this script, e.g. scripts/queue/_sample.json (empty = next in queue)"
        default: ""

permissions:
  contents: write                # to move finished scripts to scripts/done/

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          # always the newest queue, so a queued second run never redoes a video
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts (English + Bengali)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-noto-color-emoji libraqm0 fontconfig espeak-ng
          fc-list | grep -E "NotoSans(Bengali)?-Bold" | head -2

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Keep downloaded voice models between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voice-models-v1

      - name: Install open-source voices (only when one is used)
        env:
          VOICE: ${{ inputs.voice }}
        run: |
          if grep -q "kokoro:" config.yaml || [[ "$VOICE" == *kokoro* ]]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install "kokoro>=0.9.4" soundfile
          fi
          if grep -q "chatterbox:" config.yaml || [[ "$VOICE" == *chatterbox* ]]; then
            pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            pip install chatterbox-tts soundfile
          fi

      - name: Make and upload video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COUNT: ${{ inputs.count }}
          UPLOAD: ${{ inputs.upload }}
          VOICE: ${{ inputs.voice }}
          FILE: ${{ inputs.file }}
        run: |
          args=()
          if [[ "$VOICE" =~ ^[A-Za-z0-9\ ():_-]+$ ]]; then args+=(--voice "$VOICE"); fi
          if [[ "$FILE" =~ ^scripts/queue/[A-Za-z0-9._-]+\.json$ ]]; then args+=(--file "$FILE"); fi
          if [[ "$COUNT" =~ ^[0-9]+$ ]]; then args+=(--count "$COUNT"); fi
          if [[ "$UPLOAD" == "no" ]]; then args+=(--no-upload); fi
          python -m studio.main "${args[@]}"

      - name: Save the video files (Actions → this run → Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Move finished scripts to scripts/done
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts logs
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Uploaded video(s) from the queue"
          git pull --rebase --autostash
          git push
