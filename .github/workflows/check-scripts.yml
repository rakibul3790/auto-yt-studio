# Checks new script files as soon as you add them, so a broken file is
# caught right away instead of on the daily run.
name: Check scripts

on:
  push:
    paths:
      - "scripts/queue/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python -m studio.main --validate
