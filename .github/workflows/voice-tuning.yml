# Runs only on the voice-tuning branch: short ElevenLabs audio samples (2 for the new voice, about 267 credits).
name: Voice tuning samples

on:
  push:
    branches: [voice-tuning]
    paths:
      - "tools/voice_tuning.py"
      - ".github/workflows/voice-tuning.yml"

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/voice_tuning.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Save samples on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/tuning
          git diff --cached --quiet && exit 0
          git commit -m "Voice tuning samples [skip ci]"
          git push
