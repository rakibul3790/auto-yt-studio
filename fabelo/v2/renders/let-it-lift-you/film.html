<script>
/*!
 * Scribble — character library for ink-style explainer videos (v1.1)
 *
 * One recurring character ("Scribble": ink stick figure with a red scarf),
 * a bendable rig, poses, expressions, costumes, props and a time-based
 * scene engine. Everything on screen is a pure function of time t (seconds),
 * so a headless browser can seek to any frame and record it exactly.
 *
 * No dependencies. Works in any modern browser.
 * See README.md for the full API.
 */
(function (global) {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Palette — the channel uses ink + paper + ONE accent (red).
   * Ochre is only for fire, light and gold.
   * ------------------------------------------------------------------ */
  const C = {
    ink: '#1B1B1B',
    paper: '#FBF7EE',
    paperDark: '#EDE4D0',
    red: '#E63946',
    ochre: '#E9B44C',
    grey: '#9A9A9A',
    brown: '#C98B5B',
    darkBrown: '#8A5A35',
    blue: '#2B4C7E',
    green: '#6A994E',
    white: '#FFFFFF'
  };
  const SW = 7; // main ink stroke width (character units)

  /* ------------------------------------------------------------------ *
   * Math helpers
   * ------------------------------------------------------------------ */
  const rad = (d) => (d * Math.PI) / 180;
  const dir = (a, len) => [Math.sin(rad(a)) * len, Math.cos(rad(a)) * len]; // a=0 → down, a=90 → right
  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const f = (n) => Math.round(n * 100) / 100;
  const EASE = {
    linear: (k) => k,
    in: (k) => k * k * k,
    out: (k) => 1 - Math.pow(1 - k, 3),
    inOut: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
    back: (k) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);
    }
  };
  // smooth 0→1→0 window for [t0,t1] with ramps of r seconds
  const windowW = (t, t0, t1, r) => clamp(Math.min((t - t0) / r, (t1 - t) / r));

  /* ------------------------------------------------------------------ *
   * SVG builders. Every ink element gets pathLength="1" so the whole
   * drawing can "draw itself" with one CSS variable (--o).
   * ------------------------------------------------------------------ */
  const P = 'pathLength="1"';
  const line = (x1, y1, x2, y2, w = SW, c = C.ink) =>
    `<path ${P} d="M${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const poly = (pts, w = SW, c = C.ink) =>
    `<path ${P} d="M${pts.map((p) => f(p[0]) + ' ' + f(p[1])).join(' L')}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const path = (d, o = {}) =>
    `<path ${P} d="${d}" fill="${o.fill || 'none'}"${o.fill && o.fill !== 'none' ? ' class="f"' : ''} stroke="${o.stroke || C.ink}" stroke-width="${o.w == null ? 5 : o.w}" stroke-linecap="round" stroke-linejoin="round"${o.op != null ? ` opacity="${o.op}"` : ''}/>`;
  const fillOnly = (d, fill, op) =>
    `<path d="${d}" fill="${fill}" class="f" stroke="none"${op != null ? ` opacity="${op}"` : ''}/>`;
  const circle = (cx, cy, r, o = {}) =>
    `<circle ${P} cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${o.fill || 'none'}"${o.fill && o.fill !== 'none' ? ' class="f"' : ''} stroke="${o.stroke || C.ink}" stroke-width="${o.w == null ? 5 : o.w}"/>`;
  const dot = (cx, cy, r, fill = C.ink) => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="${fill}" class="f"/>`;
  const ellipse = (cx, cy, rx, ry, fill = C.ink) =>
    `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" fill="${fill}" class="f"/>`;
  const g = (inner, transform, extra = '') => `<g${transform ? ` transform="${transform}"` : ''}${extra}>${inner}</g>`;

  /* ------------------------------------------------------------------ *
   * Rig dimensions (character units; origin = ground point under hips)
   * ------------------------------------------------------------------ */
  const RIG = { torso: 50, neck: 16, headR: 30, upperArm: 28, foreArm: 28, thigh: 29, shin: 29, foot: 10 };

  /* ------------------------------------------------------------------ *
   * POSES. Angles in degrees: 0 = straight down, 90 = toward screen
   * right, 180 = straight up. Arms are relative to the torso, legs are
   * world-relative. [upper, lower] per limb. Hips auto-adjust so the
   * lowest foot stays on the ground (sitting, crouching just work).
   * aL/lL = limb on the screen-left side when facing right.
   * ------------------------------------------------------------------ */
  const POSES = {
    idle:     { lean: 0,  head: 0,   aL: [-28, -20],  aR: [28, 20],   lL: [-12, -14], lR: [12, 14] },
    wave:     { lean: -3, head: -4,  aL: [-28, -20],  aR: [100, 150], lL: [-12, -14], lR: [12, 14] },
    point:    { lean: 3,  head: 6,   aL: [-45, 30],   aR: [100, 100], lL: [-12, -14], lR: [14, 18] },
    pointUp:  { lean: 2,  head: -6,  aL: [-28, -20],  aR: [100, 170], lL: [-12, -14], lR: [12, 14] },
    explain:  { lean: 0,  head: -3,  aL: [-55, -115], aR: [55, 115],  lL: [-12, -14], lR: [12, 14] },

  /* ------------------------------------------------------------------ *
   * Face drawing (head-local coords: centre 0,0, radius 30)
   * ------------------------------------------------------------------ */
  function drawFace(e, look, blink, talkOpen) {
    const lx = look[0], ly = look[1];
    let s = '';
    const ex = 10, ey = -2;
    // eyes
    let eyes = blink && e.eyes !== 'arc' && e.eyes !== 'closed' ? 'closed' : e.eyes;
    if (eyes === 'dot') s += dot(-ex + lx, ey + ly, 4) + dot(ex + lx, ey + ly, 4);
    else if (eyes === 'wide') {
      s += circle(-ex + lx * 0.5, ey - 1, 7, { fill: C.white, w: 3 }) + circle(ex + lx * 0.5, ey - 1, 7, { fill: C.white, w: 3 });
      s += dot(-ex + lx, ey - 1 + ly * 0.5, 2.5) + dot(ex + lx, ey - 1 + ly * 0.5, 2.5);
    } else if (eyes === 'arc') {
      s += path(`M${-ex - 5 + lx} ${ey + 2} Q${-ex + lx} ${ey - 5} ${-ex + 5 + lx} ${ey + 2}`, { w: 3.5 });
      s += path(`M${ex - 5 + lx} ${ey + 2} Q${ex + lx} ${ey - 5} ${ex + 5 + lx} ${ey + 2}`, { w: 3.5 });
    } else if (eyes === 'closed') {
      s += path(`M${-ex - 5 + lx} ${ey} Q${-ex + lx} ${ey + 3} ${-ex + 5 + lx} ${ey}`, { w: 3.5 });
      s += path(`M${ex - 5 + lx} ${ey} Q${ex + lx} ${ey + 3} ${ex + 5 + lx} ${ey}`, { w: 3.5 });
    } else if (eyes === 'half') {
      s += line(-ex - 5 + lx, ey, -ex + 5 + lx, ey, 3.5) + line(ex - 5 + lx, ey, ex + 5 + lx, ey, 3.5);
      s += path(`M${-ex - 4 + lx} ${ey} Q${-ex + lx} ${ey + 5} ${-ex + 4 + lx} ${ey}`, { w: 3 });
      s += path(`M${ex - 4 + lx} ${ey} Q${ex + lx} ${ey + 5} ${ex + 4 + lx} ${ey}`, { w: 3 });
    }
    // brows
    const b = e.brows || { lift: 0, tilt: 0 };
    const by = -12 + b.lift;
    const browL = { cx: -ex + lx, lift: b.raise === 'left' ? -5 : 0 };
    const browR = { cx: ex + lx, lift: b.raise === 'right' ? -5 : 0 };
    const tilt = b.tilt || 0; // degrees
    const half = 5.5;
    const dyIn = Math.sin(rad(tilt)) * half;
    // left brow: inner end is the right end
    s += line(browL.cx - half, by + browL.lift + dyIn, browL.cx + half, by + browL.lift - dyIn, 3.5);
    s += line(browR.cx - half, by + browR.lift - dyIn, browR.cx + half, by + browR.lift + dyIn, 3.5);
    // mouth
    const mx = lx * 0.6, my = 12 + ly * 0.4;
    const m = talkOpen != null ? 'talk' : e.mouth;
    switch (m) {
      case 'smile': s += path(`M${mx - 8} ${my - 1} Q${mx} ${my + 7} ${mx + 8} ${my - 1}`, { w: 4 }); break;
      case 'grin': s += fillOnly(`M${mx - 10} ${my - 2} Q${mx} ${my + 13} ${mx + 10} ${my - 2} Z`, C.ink); break;
      case 'o': s += ellipse(mx, my + 2, 5, 7); break;
      case 'frown': s += path(`M${mx - 8} ${my + 5} Q${mx} ${my - 2} ${mx + 8} ${my + 5}`, { w: 4 }); break;
      case 'flat': s += line(mx - 7, my + 2, mx + 7, my + 2, 4); break;
      case 'side': s += line(mx - 3, my + 2, mx + 9, my, 4); break;
      case 'smirk': s += path(`M${mx - 7} ${my + 2} Q${mx + 2} ${my + 4} ${mx + 9} ${my - 2}`, { w: 4 }); break;
      case 'wavy': s += path(`M${mx - 9} ${my + 2} q3 -3 6 0 q3 3 6 0 q3 -3 6 0`, { w: 3.5 }); break;
      case 'smallO': s += ellipse(mx, my + 2, 3, 4); break;
      case 'talk': {
        const o = talkOpen;
        s += ellipse(mx, my + 1 + o * 2, 5 + o * 1.5, 1.5 + o * 6);
        break;
      }
    }
    return s;
  }

      g(path('M-30 -90 C-10 -96 4 -80 -6 -66 C-16 -52 -34 -60 -40 -74 Z M10 -50 C24 -56 40 -44 34 -26 C24 -18 8 -26 10 -50 Z', { fill: C.green, w: 3 }), `translate(${f((t * 8) % 20 - 10)} 0)`) +
      line(0, -6, 0, 6, 6) + line(-30, 6, 30, 6, 6)
  };

  // how a held prop sits in the hand (prop units)
  const HOLD = {
    spear:     { s: 0.8, dx: 0, dy: 95, rot: 0 },
    torch:     { s: 0.85, dx: 0, dy: 30, rot: 0 },
    book:      { s: 0.42, dx: 0, dy: 10, rot: 0 },
    scroll:    { s: 0.42, dx: 0, dy: 20, rot: 0 },
    phone:     { s: 0.3, dx: 0, dy: 20, rot: 0 },
    lightbulb: { s: 0.4, dx: 0, dy: 10, rot: 0 },
    coin:      { s: 0.5, dx: 0, dy: 8, rot: 0 },
    money:     { s: 0.45, dx: 0, dy: 10, rot: 0 },
    heart:     { s: 0.35, dx: 0, dy: 10, rot: 0 },
    globe:     { s: 0.35, dx: 0, dy: 10, rot: 0 },
    clock:     { s: 0.4, dx: 0, dy: 10, rot: 0 }
  };

  /* ------------------------------------------------------------------ *
   * Character state → SVG (character-local coordinates)
   * ------------------------------------------------------------------ */
  function blendPose(a, b, k) {
    const o = {};
    for (const key of ['lean', 'head', 'jump']) o[key] = lerp(a[key] || 0, b[key] || 0, k);
    for (const key of ['aL', 'aR', 'lL', 'lR']) o[key] = [lerp(a[key][0], b[key][0], k), lerp(a[key][1], b[key][1], k)];
    return o;
  }
  const clonePose = (p) => blendPose(p, p, 0);

  const hipOf = (p) => -Math.max(
    RIG.thigh * Math.cos(rad(p.lL[0])) + RIG.shin * Math.cos(rad(p.lL[1])),
    RIG.thigh * Math.cos(rad(p.lR[0])) + RIG.shin * Math.cos(rad(p.lR[1]))) - (p.jump || 0);

  /**
   * state = { pose, expr, look, blink, talk(0..1|null), costume, hold, feet:'splay'|'forward', t, scarfSway }
   * returns svg string, origin at ground under hips, ~185 units tall
   */
  function drawCharacter(st) {
    const p = st.pose;
    const t = st.t || 0;
    const legDrop = (l) => RIG.thigh * Math.cos(rad(l[0])) + RIG.shin * Math.cos(rad(l[1]));
    const hipY = -Math.max(legDrop(p.lL), legDrop(p.lR)) - (p.jump || 0);
    const hip = [0, hipY];
    const lean = p.lean;
    const up = [Math.sin(rad(lean)), -Math.cos(rad(lean))];
    const sh = [hip[0] + up[0] * RIG.torso, hip[1] + up[1] * RIG.torso];
    const neckTop = [sh[0] + up[0] * RIG.neck, sh[1] + up[1] * RIG.neck];
    const ht = lean + p.head;
    const headC = [neckTop[0] + Math.sin(rad(ht)) * RIG.headR, neckTop[1] - Math.cos(rad(ht)) * RIG.headR];
    const cos = COSTUMES[st.costume] || null;

    const limb = (origin, ang, l1, l2, rel) => {
      const a1 = ang[0] + rel, a2 = ang[1] + rel;
      const d1 = dir(a1, l1), j = [origin[0] + d1[0], origin[1] + d1[1]];
      const d2 = dir(a2, l2), e = [j[0] + d2[0], j[1] + d2[1]];
      return { j, e, a2 };
    };
    const legL = limb(hip, p.lL, RIG.thigh, RIG.shin, 0);
    const legR = limb(hip, p.lR, RIG.thigh, RIG.shin, 0);
    const armL = limb(sh, p.aL, RIG.upperArm, RIG.foreArm, -lean);
    const armR = limb(sh, p.aR, RIG.upperArm, RIG.foreArm, -lean);
    const fwd = st.feet === 'forward';

    let s = '';
    // back costume layer
    if (cos && cos.back) s += g(cos.back, `translate(${f(sh[0])} ${f(sh[1])}) rotate(${f(lean)})`);
    // legs + feet
    s += poly([hip, legL.j, legL.e]) + line(legL.e[0], legL.e[1], legL.e[0] + (fwd ? RIG.foot : -RIG.foot), legL.e[1] + 1.5);
    s += poly([hip, legR.j, legR.e]) + line(legR.e[0], legR.e[1], legR.e[0] + RIG.foot, legR.e[1] + 1.5);
    // torso + neck
    s += line(hip[0], hip[1], neckTop[0], neckTop[1]);
    // body costume
    if (cos && cos.body) s += g(cos.body, `translate(${f(sh[0])} ${f(sh[1])}) rotate(${f(lean)})`);
    // head
    let head = circle(0, 0, RIG.headR, { fill: C.paper, w: SW });
    if (!(cos && cos.hideHair)) head += HAIR[st.hair || 'tuft'] || '';
    const e = EXPRESSIONS[st.expr] || EXPRESSIONS.neutral;
    const look = st.look || e.look || [0, 0];
    head += drawFace(e, look, st.blink, st.talk);
    if (cos && cos.face) head += cos.face;
    if (cos && cos.head) head += cos.head;
    s += g(head, `translate(${f(headC[0])} ${f(headC[1])}) rotate(${f(ht)})`);
    // scarf (signature) — knot + swinging tail
    const sway = (st.scarfSway || 0) + Math.sin(t * 2.6) * 2.5;
    if (st.scarf !== false) {
      const sc = typeof st.scarf === 'string' ? st.scarf : C.red;
      s += g(
        path('M-14 -6 Q0 5 14 -6', { stroke: sc, w: 10 }) +
          path(`M8 -1 Q${f(13 + sway * 0.4)} 10 ${f(15 + sway)} 22`, { stroke: sc, w: 8 }),
        `translate(${f(sh[0] + up[0] * 6)} ${f(sh[1] + up[1] * 6)}) rotate(${f(lean)})`
      );
    }
    // arms
    s += poly([sh, armL.j, armL.e]);
    s += poly([sh, armR.j, armR.e]);
    // held prop (right hand)
    if (st.hold && PROPS[st.hold]) {
      const h = HOLD[st.hold] || { s: 0.4, dx: 0, dy: 10, rot: 0 };
      s += g(g(PROPS[st.hold](t, st.holdOpts || {}), `scale(${h.s}) translate(${h.dx} ${h.dy}) rotate(${h.rot})`), `translate(${f(armR.e[0])} ${f(armR.e[1])})`);
    }
    return s;
  }

  /* ------------------------------------------------------------------ *
   * Tracks: numeric (eased segments) and discrete (switch at time)
   * ------------------------------------------------------------------ */
  class Track {
    constructor(v) { this.v0 = v; this.segs = []; }
    to(t0, dur, value, e = 'inOut') {
      this.segs.push({ t0, t1: t0 + Math.max(0, dur), to: value, e });
      this.segs.sort((a, b) => a.t0 - b.t0);
      return this;
    }
    at(t) {
      let v = this.v0;
      for (const s of this.segs) {
        if (t < s.t0) break;
        if (t >= s.t1) { v = s.to; continue; }
        return lerp(v, s.to, EASE[s.e]((t - s.t0) / (s.t1 - s.t0)));
      }
      return v;
    }
  }
  class Discrete {
    constructor(v) { this.v0 = v; this.keys = []; }
    set(t, v) { this.keys.push({ t, v }); this.keys.sort((a, b) => a.t - b.t); return this; }
    at(t) { let v = this.v0; for (const k of this.keys) { if (t < k.t) break; v = k.v; } return v; }
    lastChange(t) { let c = -1e9; for (const k of this.keys) { if (t < k.t) break; c = k.t; } return c; }
  }

  /* ------------------------------------------------------------------ *
   * Character (timeline object)
   * ------------------------------------------------------------------ */
  let charSeed = 0;
  class Character {
    constructor(scene, o = {}) {
      this.scene = scene;
      this.seed = (charSeed++ * 1.37) % 3;
      this.x = new Track(o.x || 0);
      this.y = new Track(o.y == null ? scene.ground : o.y);
      this.scale = new Track(o.scale || 2.2);
      this.opacity = new Track(o.opacity == null ? 1 : o.opacity);
      this.facing = new Discrete(o.facing || 1);
      this.exprT = new Discrete(o.expr || 'neutral');
      this.lookT = new Discrete(null);
      this.costumeT = new Discrete(o.costume || null);
      this.holdT = new Discrete(o.hold || null);
      this.poseKeys = [];
      this.initPose = clonePose(POSES[o.pose || 'idle']);
      this.walks = [];
      this.talks = [];
      this.waves = [];
      this.draw = null;
      this.autoBlink = o.blink !== false;
      this.scarf = o.scarf == null ? true : o.scarf;   // false = no scarf (extras), or a colour
      this.hair = o.hair || 'tuft';                    // tuft | bun | long | spiky | none
      this.anchor = o.anchor || 'ground';              // 'hip' keeps the hips at (x, y): use for lying/sitting in bed
      this.rot = new Track(o.rotate || 0);
    }
    /** Rotate the whole body around the hips (e.g. -90 = lying down, head to the left) */
    rotateTo(at, dur, deg, e = 'inOut') { this.rot.to(at, dur, deg, e); return this; }
    /** Move to a pose. at=start time, dur=blend time */
    pose(at, name, o = {}) {
      const base = typeof name === 'string' ? POSES[name] : name;
      if (!base) throw new Error('Scribble: unknown pose ' + name);
      this.poseKeys.push({ t: at, dur: o.dur == null ? 0.35 : o.dur, pose: o.tweak ? blendPose(base, Object.assign(clonePose(base), o.tweak), 1) : base });
      this.poseKeys.sort((a, b) => a.t - b.t);
      if (o.expr) this.expr(at, o.expr);
      return this;
    }
    expr(at, name) { this.exprT.set(at, name); return this; }
    look(at, xy) { this.lookT.set(at, xy); return this; }
    costume(at, name) { this.costumeT.set(at, name || null); return this; }
    hold(at, prop, opts) { this.holdT.set(at, prop ? { name: prop, opts: opts || {} } : null); return this; }
    face(at, dirn) { this.facing.set(at, dirn >= 0 ? 1 : -1); return this; }
    moveTo(at, dur, x, y, e = 'inOut') { this.x.to(at, dur, x, e); if (y != null) this.y.to(at, dur, y, e); return this; }
    scaleTo(at, dur, s, e = 'inOut') { this.scale.to(at, dur, s, e); return this; }
    fade(at, dur, op) { this.opacity.to(at, dur, op); return this; }
    /** Walk from current x to `to` between t0 and t1. */
    walk(t0, t1, to, o = {}) {
      const from = this.x.at(t0);
      this.x.to(t0, t1 - t0, to, 'linear');
      this.face(t0, to >= from ? 1 : -1);
      this.walks.push({ t0, t1, from, to, run: !!o.run, keepArms: !!o.keepArms });
      return this;
    }
    run(t0, t1, to) { return this.walk(t0, t1, to, { run: true }); }
    talk(t0, t1) { this.talks.push({ t0, t1 }); return this; }
    wave(t0, t1) { this.pose(t0, 'wave', { dur: 0.3 }); this.waves.push({ t0, t1 }); return this; }
    /** Ink "draws itself" between at and at+dur */
    drawOn(at, dur = 1.5) { this.draw = { t0: at, dur }; return this; }

    stateAt(t) {
      let pose = clonePose(this.initPose);
      for (const k of this.poseKeys) {
        if (t < k.t) break;
        const kk = k.dur <= 0 ? 1 : EASE.inOut(clamp((t - k.t) / k.dur));
        pose = blendPose(pose, k.pose, kk);
      }
      const sc = this.scale.at(t);
      let feet = 'splay', look = this.lookT.at(t), scarfSway = 0;
      // walking / running
      for (const w of this.walks) {
        if (t < w.t0 - 0.01 || t > w.t1 + 0.25) continue;
        const ww = windowW(t, w.t0 - 0.05, w.t1 + 0.2, 0.2);
        if (ww <= 0) continue;
        const speed = Math.abs(w.to - w.from) / Math.max(0.01, w.t1 - w.t0);
        const amp = w.run ? 38 : 24;
        const stride = 2 * 2 * 58 * Math.sin(rad(amp)) * sc;
        const ph = 2 * Math.PI * (speed / Math.max(1, stride)) * (clamp(t, w.t0, w.t1) - w.t0);
        const leg = (p0) => {
          const u = amp * Math.sin(p0);
          return [u, u - (w.run ? 55 : 30) * Math.max(0, Math.cos(p0))];
        };
        const armA = (p0, side) => {
          const u = side * 8 + (w.run ? 40 : 24) * Math.sin(p0);
          return [u, u + (w.run ? 70 : 20)];
        };
        const wp = {
          lean: w.run ? 14 : 3, head: w.run ? -6 : 0, jump: w.run ? 6 * Math.abs(Math.sin(ph)) : 0,
          lL: leg(ph), lR: leg(ph + Math.PI), aL: w.keepArms ? pose.aL : armA(ph + Math.PI, -1), aR: w.keepArms ? pose.aR : armA(ph, 1)
        };
        pose = blendPose(pose, wp, ww);
        if (ww > 0.5) feet = 'forward';
        if (!look) look = [4 * ww, 0];
        scarfSway = -6 * ww * (w.run ? 1.6 : 1) + Math.sin(ph * 2) * 2;
      }
      // waving forearm
      for (const w of this.waves) {
        const ww = windowW(t, w.t0, w.t1, 0.25);
        if (ww > 0) pose.aR[1] += 22 * Math.sin((t - w.t0) * Math.PI * 2 * 2.2) * ww;
      }
      // talking
      let talk = null;
      for (const tk of this.talks) {
        if (t >= tk.t0 && t <= tk.t1) {
          const k = t * 1.0 + this.seed;
          talk = clamp(Math.abs(Math.sin(k * 11)) * (0.55 + 0.45 * Math.abs(Math.sin(k * 3.7))));
          if (Math.sin(k * 1.9) > 0.92) talk *= 0.2; // little pauses
        }
      }
      const blink = this.autoBlink && ((t + this.seed) % 3.4) < 0.13;
      const h = this.holdT.at(t);
      // costume "poof" pulse
      const cc = this.costumeT.lastChange(t);
      const poof = t - cc < 0.35 ? Math.sin(((t - cc) / 0.35) * Math.PI) * 0.1 : 0;
      return {
        pose, expr: this.exprT.at(t), look, blink, talk, costume: this.costumeT.at(t),
        hold: h ? h.name : null, holdOpts: h ? h.opts : null, feet, t, scarfSway, scarf: this.scarf, hair: this.hair, rot: this.rot.at(t),
        x: this.x.at(t), y: this.y.at(t), scale: sc * (1 + poof), facing: this.facing.at(t), opacity: this.opacity.at(t)
      };
    }
    render(t) {
      const st = this.stateAt(t);
      if (st.opacity <= 0.001) return '';
      let drawStyle = '';
      if (this.draw) {
        const k = clamp((t - this.draw.t0) / this.draw.dur);
        if (k <= 0) return '';
        if (k < 1) drawStyle = ` class="sb-draw" style="--o:${f(1 - EASE.inOut(clamp(k / 0.8)))};--fo:${f(clamp((k - 0.55) / 0.45))}"`;
      }
      const body = drawCharacter(st);
      const hy = hipOf(st.pose);
      const inner = this.anchor === 'hip'
        ? `rotate(${f(st.rot)}) translate(0 ${f(-hy)})`
        : (st.rot ? `rotate(${f(st.rot)} 0 ${f(hy)})` : '');
      return g(body, `translate(${f(st.x)} ${f(st.y)}) scale(${f(st.scale * st.facing)} ${f(st.scale)}) ${inner}`, (st.opacity < 1 ? ` opacity="${f(st.opacity)}"` : '') + drawStyle);
    }
  }

  /* ------------------------------------------------------------------ *
   * Scene
   * ------------------------------------------------------------------ */
  let sceneCount = 0;
  const STYLE_ID = 'scribble-style';
  function injectStyle() {
    if (typeof document === 'undefined' || document.getElementById(STYLE_ID)) return;
    const st = document.createElement('style');
    st.id = STYLE_ID;
    st.textContent =
      '.sb-draw [pathLength]{stroke-dasharray:1 1;stroke-dashoffset:var(--o)}' +
      '.sb-draw .f{fill-opacity:var(--fo)}' +
      '.sb-stage{position:fixed;inset:0;width:100%;height:100%;display:block;background:' + C.paper + '}';
    document.head.appendChild(st);
  }

  class Scene {
    /**
     * container: element to fill (the SVG is created inside)
     * o.duration (s), o.ground (y of the floor, default 300),
     * o.fadeIn / o.fadeOut (s), o.groundLine (bool), o.wobble (bool), o.loop
     *
     * Coordinates: the SAFE AREA is the square x,y ∈ [-500, 500].
     * It is always fully visible on 16:9, 9:16, 1:1 or any ratio; the paper
     * simply extends past it on the longer side. Keep important things inside.
     */
    constructor(container, o = {}) {
      injectStyle();
      this.id = 'sb' + sceneCount++;
      this.duration = o.duration || 10;
      this.ground = o.ground == null ? 300 : o.ground;
      this.fadeIn = o.fadeIn == null ? 0.8 : o.fadeIn;
      this.fadeOut = o.fadeOut == null ? 0.8 : o.fadeOut;
      this.loop = o.loop !== false;
      this.groundLine = o.groundLine !== false;
      this.wobble = o.wobble === true; // subtle hand-drawn wobble; off by default because it slows recording
      this.chars = [];
      this.props = [];
      this.texts = [];
      this.customs = [];
      this.t = 0;
      this.playing = false;
      if (typeof document !== 'undefined' && container) this._mount(container);
    }
    _mount(container) {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'sb-stage');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Animated scene');
      svg.innerHTML =
        `<defs>` +
        `<filter id="${this.id}-wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>` +
        `<radialGradient id="${this.id}-vig" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#5a4a2a" stop-opacity="0.10"/></radialGradient>` +
        `</defs>` +
        `<g id="${this.id}-root"></g>` +
        `<rect id="${this.id}-vigr" fill="url(#${this.id}-vig)" pointer-events="none"/>`;
      // paper grain: one small tile rasterised once by the browser (cheap per frame)
      const tile = '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.25 0 0 0 0.10 0"/></filter><rect width="360" height="360" filter="url(#n)"/></svg>';
      svg.style.backgroundColor = C.paper;
      svg.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(tile)}")`;
      svg.style.backgroundSize = '360px 360px';
      container.appendChild(svg);
      this.svg = svg;
      this.root = svg.querySelector(`#${this.id}-root`);
      this.vig = svg.querySelector(`#${this.id}-vigr`);
      this._resize = () => this.fit();
      window.addEventListener('resize', this._resize);
      this.fit();
    }
    /** Fit the safe square into any viewport ratio (nothing is ever cut). */
    fit() {
      if (!this.svg) return;
      const r = this.svg.getBoundingClientRect();
      const W = r.width || window.innerWidth, H = r.height || window.innerHeight;
      const a = W / H, S = 1000;
      const vw = a >= 1 ? S * a : S, vh = a >= 1 ? S : S / a;
      this.view = { x: -vw / 2, y: -vh / 2, w: vw, h: vh };
      this.svg.setAttribute('viewBox', `${f(-vw / 2)} ${f(-vh / 2)} ${f(vw)} ${f(vh)}`);
      this.svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      this.vig.setAttribute('x', f(-vw / 2)); this.vig.setAttribute('y', f(-vh / 2));
      this.vig.setAttribute('width', f(vw)); this.vig.setAttribute('height', f(vh));
      this.render(this.t);
    }
    character(o) { const c = new Character(this, o); this.chars.push(c); return c; }
    /**
     * Place a prop. o: {x, y, scale, at (draw start), draw (draw seconds, 0 = pop),
     * out (fade-out start), outDur, front (draw over characters), flip, opts}
     */
    prop(name, o = {}) {
      if (!PROPS[name]) throw new Error('Scribble: unknown prop ' + name);
      const p = Object.assign({ name, x: 0, y: this.ground, scale: 1, at: 0, draw: 0.8, out: null, outDur: 0.4, front: false, flip: false, opts: {} }, o);
      this.props.push(p);
      return p;
    }
    /**
     * Handwritten text. o: {x, y, size, at, until, style:'title'|'label'|'caption', color, write (seconds of write-on)}
     */
    text(str, o = {}) {
      const tx = Object.assign({ str, x: 0, y: -380, size: 64, at: 0, until: this.duration, color: C.ink, write: 0.6, weight: 700 }, o);
      this.texts.push(tx);
      return tx;
    }
    /** Add your own drawing: fn(t, scene) → svg string. layer: 'back' | 'front' */
    custom(fn, layer = 'back') { this.customs.push({ fn, layer }); return this; }

    _propSvg(p, t) {
      if (t < p.at) return '';
      let op = 1;
      if (p.out != null && t >= p.out) op = 1 - clamp((t - p.out) / p.outDur);
      if (op <= 0) return '';
      const k = p.draw > 0 ? clamp((t - p.at) / p.draw) : 1;
      const pop = p.draw > 0 ? 1 : EASE.back(clamp((t - p.at) / 0.3));
      const extra = (op < 1 ? ` opacity="${f(op)}"` : '') + (k < 1 ? ` class="sb-draw" style="--o:${f(1 - EASE.inOut(clamp(k / 0.85)))};--fo:${f(clamp((k - 0.5) / 0.5))}"` : '');
      return g(PROPS[p.name](t, p.opts), `translate(${f(p.x)} ${f(p.y)}) scale(${f(p.scale * pop * (p.flip ? -1 : 1))} ${f(p.scale * pop)})`, extra);
    }
    _textSvg(tx, i, t) {
      if (t < tx.at || t > tx.until) return '';
      const fin = clamp((t - tx.at) / 0.35), fout = clamp((tx.until - t) / 0.35);
      const op = Math.min(fin, fout);
      const k = tx.write > 0 ? EASE.out(clamp((t - tx.at) / tx.write)) : 1;
      const wEst = tx.str.length * tx.size * 0.55 + tx.size;

    custom(fn, layer = 'back') { this.sc.custom(fn, layer); return this; }
    /** Parallax layer. depth < 1 = far (moves less), > 1 = near/foreground. fn(t, view) → svg (world units). */
    layer(depth, fn, o = {}) { this.layers.push({ depth, fn, front: o.front != null ? o.front : depth > 1, blur: o.blur || 0, op: o.opacity == null ? 1 : o.opacity }); return this; }
    /** Colour light over the whole shot (multiply). Animate with several calls: tint(at, dur, '#B9C3D9', 0.3). */
    tint(at, dur, color, op) { this.tintOp.to(at, dur, op, 'inOut'); if (color) this.tintCol.push({ at, color }); this.tintCol.sort((a, b) => a.at - b.at); return this; }
    _tint(t) {
      if (!this.tintCol.length) return { color: null, op: 0 };
      let color = this.tintCol[0].color;
      for (const k of this.tintCol) if (t >= k.at) color = k.color;
      return { color, op: this.tintOp.at(t) };
    }
  }

  /* ---------------------------------------------------- transitions */
  const TR_DEFAULT_DUR = { cut: 0, smash: 0, dissolve: 0.6, dip: 0.8, whip: 0.42, iris: 1.0, ink: 1.0, page: 0.9, match: 0.5 };
  const TR_SFX = { whip: 'whip', ink: 'splat', page: 'page', iris: 'iris', smash: 'impact', match: 'swish', dip: null, dissolve: null, cut: null };

  function blobPath(cx, cy, R, seed, spikes = true) {
    const N = 56; const pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * TAU;
      let r = R * (1 + 0.13 * Math.sin(a * 3 + seed) + 0.08 * Math.sin(a * 7 + seed * 2.3) + 0.05 * Math.sin(a * 13 + seed * 1.7));
      if (spikes && i % 7 === 3) r *= 1.16;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    let d = '';
    for (let i = 0; i < N; i++) {
      const p = pts[i], q = pts[(i + 1) % N], m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      d += (i === 0 ? `M${f((pts[N - 1][0] + p[0]) / 2)} ${f((pts[N - 1][1] + p[1]) / 2)}` : '') + `Q${f(p[0])} ${f(p[1])} ${f(m[0])} ${f(m[1])}`;
    }
    return d + 'Z';
  }
  const rectPath = (v, m = 40) => `M${f(v.x - m)} ${f(v.y - m)}H${f(v.x + v.w + m)}V${f(v.y + v.h + m)}H${f(v.x - m)}Z`;

  /* ---------------------------------------------------------------- film */
  class Film {
    /**
     * Fabelo2.film(container, { duration, bpm, beatOffset, fadeIn, fadeOut, captions })
     * container = document.body for a page; null for headless (tests / svg export).
     */
    constructor(container, o = {}) {
      this.duration = o.duration || 30;
      this.bpm = o.bpm || 72;
      this.beatOffset = o.beatOffset || 0;
      this.fadeIn = o.fadeIn == null ? 0.9 : o.fadeIn;
      this.fadeOut = o.fadeOut == null ? 1.2 : o.fadeOut;
      this.shots = []; this.cuts = []; this.titles = []; this.huds = []; this.cues = [];
      this.capCfg = null;
      this.view = { x: -889, y: -500, w: 1778, h: 1000 };
      this.t = 0;
      if (container && typeof document !== 'undefined') {
        this.stage = S.createScene(container, { duration: this.duration, groundLine: false, fadeIn: this.fadeIn, fadeOut: this.fadeOut, loop: true });
        this.stage.render = (t) => this.render(t);
        // scale text and lines as pure geometry: hinted glyphs snap to whole pixels and wobble on a zoom
        if (this.stage.svg) { this.stage.svg.setAttribute('text-rendering', 'geometricPrecision'); this.stage.svg.setAttribute('shape-rendering', 'geometricPrecision'); }
        this.stage.fit();
      }
    }
    /* ---- timing helpers ---- */
    /** Time of beat n (music grid). */
    beat(n) { return this.beatOffset + (n * 60) / this.bpm; }
    /** Snap a time to the nearest beat (or to 1/div of a beat). */
    snap(t, div = 1) { const b = 60 / this.bpm / div; return this.beatOffset + Math.round((t - this.beatOffset) / b) * b; }
    /** A custom cue for the audio mix: film.cue('sfx', 12.3, {name:'thud', gain:0.4}). */
    cue(kind, at, data = {}) { this.cues.push(Object.assign({ kind, at }, data)); return this; }

    /* ---- building ---- */
    shot(t0, t1, o) { const s = new Shot(this, t0, t1, o); this.shots.push(s); this.shots.sort((a, b) => a.t0 - b.t0); return s; }
    /**
     * Transition at time `at` (the boundary between two shots).
     * type: cut | smash | dissolve | dip | whip | iris | ink | page | match
     * o: { dur, dir (whip/page: 1 = to the left), at: [x,y] screen point (iris/ink centre),
     *      color (dip/iris/ink: default ink), from:[x,y], to:[x,y] (match: world points), sfx:false }
     */
    cut(at, type = 'cut', o = {}) {
      const dur = o.dur != null ? o.dur : TR_DEFAULT_DUR[type] || 0;
      const c = Object.assign({ at, type, dur, dir: 1, color: C.ink, seed: this.cuts.length * 2.9 + 1 }, o, { at, type, dur });
      this.cuts.push(c); this.cuts.sort((a, b) => a.at - b.at);
      return this;
    }
    /** Screen-space handwritten title (not moved by the camera). */
    title(str, o = {}) {
      this.titles.push(Object.assign({ str, x: 0, y: -380, size: 72, at: 0, until: this.duration, write: 0.7, color: C.ink, weight: 700 }, o));
      return this;
    }
    /** Screen-space drawing on top of everything (lower thirds, logos): fn(t, view) → svg. */
    hud(fn) { this.huds.push(fn); return this; }
    /**
     * Word-by-word captions for Shorts.
     * lines: LINES array [speaker, start, end, text]; timing from window.__TIMING (voices.py) when present.
     * o: { speakers: ['narrator'] (null = all), y: 372, size: 74, maxWords: 3, maxWidth: 880, highlight: red }
     */
    captions(lines, o = {}) {
      this.capCfg = Object.assign({ speakers: null, y: 372, size: 74, maxWords: 3, maxWidth: 880, highlight: C.red, color: C.ink, stroke: C.paper }, o);
      this.capChunks = buildCaptionChunks(lines, this.capCfg, global.__TIMING);
      return this;
    }

    /* ---- rendering ---- */
    _shotAt(t) {
      let cur = null;
      for (const s of this.shots) if (t >= s.t0 - 1e-6) cur = s;
      return cur || this.shots[0];
    }
    _shotBefore(at) { let p = null; for (const s of this.shots) if (s.t0 < at - 1e-6) p = s; return p; }
    _shotFrom(at) { for (const s of this.shots) if (s.t0 >= at - 1e-6) return s; return null; }

    /** World → screen point for a shot at time t. */
    toScreen(shot, t, p) {
      const c = shot.cam.at(t, this.view), r = (c.rot * Math.PI) / 180;
      const x = (p[0] - c.cx) * c.z, y = (p[1] - c.cy) * c.z;
      return [x * Math.cos(r) - y * Math.sin(r), x * Math.sin(r) + y * Math.cos(r)];
    }

    _shotSVG(sh, t, v, uid) {
      const c = sh.cam.at(t, v);
      const tr = (d) => {
        const zd = 1 + (c.z - 1) * d;
        return { zd, s: `rotate(${fp(c.rot)}) scale(${fp(zd)}) translate(${fp(-c.cx * d)} ${fp(-c.cy * d)})`, view: { x: c.cx * d - v.w / (2 * zd), y: c.cy * d - v.h / (2 * zd), w: v.w / zd, h: v.h / zd } };
      };
      let defs = '', out = '';
      const layerSVG = (L, i) => {
        const T = tr(L.depth);
        let body = L.fn(t, T.view, sh);
        if (!body) return '';
        let attr = '';
        if (L.blur > 0) { const id = `${uid}b${i}`; defs += `<filter id="${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${fp(L.blur / T.zd)}"/></filter>`; attr += ` filter="url(#${id})"`; }
        if (L.op < 1) attr += ` opacity="${f(L.op)}"`;
        return `<g transform="${T.s}"${attr}>${body}</g>`;
      };
      sh.layers.forEach((L, i) => { if (!L.front) out += layerSVG(L, i); });
      // main stage (depth 1): ground line, v1 customs, props, characters, texts
      const T1 = tr(1), wv = T1.view, sc = sh.sc;
      const proxy = Object.create(sc); proxy.view = wv;
      let s = '';
      if (sh.groundLine) {
        const k = sh.groundDraw > 0 ? clamp((t - sh.t0) / sh.groundDraw) : 1;
        if (k > 0) {
          const x0 = wv.x - 60, x1 = wv.x + wv.w + 60, gy = sh.ground;
          const dash = k < 1 ? ` class="sb-draw" style="--o:${f(1 - E.inOut(k))};--fo:1"` : '';
          s += `<g${dash}>` + sv.path(`M${f(x0)} ${gy + 4} Q${f((x0 + x1) / 2)} ${gy - 2} ${f(x1)} ${gy + 3}`, { w: 4, op: 0.55 }) + `</g>`;
        }
      }
      for (const cu of sc.customs) if (cu.layer === 'back') s += cu.fn(t, proxy);
      for (const p of sc.props) if (!p.front) s += sc._propSvg(p, t);
      for (const ch of sc.chars) { const r = ch.render(t); if (r) s += `<g data-qc="char">${r}</g>`; }
      for (const p of sc.props) if (p.front) s += sc._propSvg(p, t);
      for (const cu of sc.customs) if (cu.layer === 'front') s += cu.fn(t, proxy);
      sc.texts.forEach((tx, i) => (s += sc._textSvg(tx, i, t)));
      out += `<g transform="${T1.s}">${s}</g>`;
      sh.layers.forEach((L, i) => { if (L.front) out += layerSVG(L, i); });
      const ti = sh._tint(t);
      if (ti.color && ti.op > 0.004) out += `<rect x="${f(v.x - 20)}" y="${f(v.y - 20)}" width="${f(v.w + 40)}" height="${f(v.h + 40)}" fill="${ti.color}" style="mix-blend-mode:multiply" opacity="${f(ti.op)}"/>`;
      return (defs ? `<defs>${defs}</defs>` : '') + out;
    }

    _transitionSVG(cu, t, v) {
      const A = this._shotBefore(cu.at), B = this._shotFrom(cu.at);
      const a0 = cu.at - cu.dur / 2;
      const p = clamp((t - a0) / Math.max(1e-3, cu.dur));
      const out = () => (A ? this._shotSVG(A, t, v, 'tA') : '');
      const inn = () => (B ? this._shotSVG(B, t, v, 'tB') : '');
      const R = Math.hypot(v.w, v.h) / 2 + 80;
      const cxy = cu.center || [0, 0];
      switch (cu.type) {
        case 'dissolve': {
          const k = E.sineInOut(p);
          return out() + `<g opacity="${f(k)}">${inn()}</g>`;
        }
        case 'dip': {
          const k = p < 0.5 ? E.inOut(p * 2) : E.inOut((1 - p) * 2);
          const col = cu.color === C.ink && cu.paper !== false ? C.paper : cu.color;
          return (p < 0.5 ? out() : inn()) + `<rect x="${f(v.x - 20)}" y="${f(v.y - 20)}" width="${f(v.w + 40)}" height="${f(v.h + 40)}" fill="${col}" opacity="${f(k)}"/>`;
        }
        case 'whip': {
          const first = p < 0.5;
          const k = first ? E.expoIn(p * 2) : 1 - E.expoOut((p - 0.5) * 2);
          const dx = (first ? -1 : 1) * cu.dir * k * v.w * 0.62;
          const blur = 3 + 55 * k;
          return `<defs><filter id="whipF" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="${f(blur)} 0"/></filter></defs>` +
            `<g transform="translate(${fp(dx)} 0)" filter="url(#whipF)">${first ? out() : inn()}</g>`;
        }
        case 'iris': {
          const first = p < 0.5;
          const k = first ? 1 - E.inOut(p * 2) : E.inOut((p - 0.5) * 2);
          const r = Math.max(0, R * k);
          const c0 = first ? (cu.from || cxy) : (cu.to || cxy);
          const hole = r > 0.5 ? `M${f(c0[0] - r)} ${f(c0[1])}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0Z` : '';
          const ring = r > 0.5 ? `<circle cx="${f(c0[0])}" cy="${f(c0[1])}" r="${f(r)}" fill="none" stroke="${C.ink}" stroke-width="7" opacity="0.6"/>` : '';
          return (first ? out() : inn()) + `<path d="${rectPath(v)}${hole}" fill="${cu.color}" fill-rule="evenodd"/>` + ring;
        }
        case 'ink': {
          const first = p < 0.5;
          const c0 = first ? (cu.from || cxy) : (cu.to || cxy);
          if (first) {
            const k = E.expoIn(clamp(p * 2));
            const r = R * 1.3 * k;
            let drops = '';
            for (let i = 0; i < 12; i++) {
              const a = hash(i + cu.seed) * Math.PI, dd = r * (1.15 + 0.35 * Math.abs(hash(i * 3.1 + cu.seed))), rr = R * 0.035 * (0.5 + Math.abs(hash(i * 1.7))) * Math.min(1, k * 3);
              drops += `<circle cx="${f(c0[0] + Math.cos(a * 2) * dd)}" cy="${f(c0[1] + Math.sin(a * 2) * dd)}" r="${f(rr)}" fill="${cu.color}"/>`;
            }
            return out() + (r > 1 ? `<path d="${blobPath(c0[0], c0[1], r, cu.seed)}" fill="${cu.color}"/>` + drops : '');
          }
          const k = E.expoOut(clamp((p - 0.5) * 2));
          const r = R * 1.35 * k;
          return inn() + `<path d="${rectPath(v)}${r > 1 ? blobPath(c0[0], c0[1], r, cu.seed + 5, false) : ''}" fill="${cu.color}" fill-rule="evenodd"/>`;
        }
        case 'page': {
          const e = E.inOut(p), dir = cu.dir >= 0 ? 1 : -1;
          // fold line moves across the screen; outgoing page stays on the near side, its back curls over
          const L = v.x, Rr = v.x + v.w, W = v.w;
          const xf = dir > 0 ? Rr - e * (W * 1.25) : L + e * (W * 1.25);
          const curl = Math.sin(Math.PI * e) * v.h * 0.08;
          const xt = xf + curl * dir, xb = xf - curl * dir;           // top / bottom of the fold
          const keep = dir > 0 ? `M${f(L - 40)} ${f(v.y - 40)}L${f(xt)} ${f(v.y - 40)}L${f(xb)} ${f(v.y + v.h + 40)}L${f(L - 40)} ${f(v.y + v.h + 40)}Z`
            : `M${f(Rr + 40)} ${f(v.y - 40)}L${f(xt)} ${f(v.y - 40)}L${f(xb)} ${f(v.y + v.h + 40)}L${f(Rr + 40)} ${f(v.y + v.h + 40)}Z`;
          const fw = Math.min(Math.abs((dir > 0 ? Rr : L) - xf), W * 0.42) * 0.85;
          const flap = `M${f(xt)} ${f(v.y - 40)}L${f(xt - dir * fw * 1.1)} ${f(v.y - 40)}Q${f(xb - dir * fw * 0.7)} ${f(v.y + v.h * 0.5)} ${f(xb - dir * fw * 0.9)} ${f(v.y + v.h + 40)}L${f(xb)} ${f(v.y + v.h + 40)}Z`;
          const gid = 'pgG', sid = 'pgS';
          return `<defs><clipPath id="pgC"><path d="${keep}"/></clipPath>` +
            `<linearGradient id="${gid}" x1="${dir > 0 ? 1 : 0}" y1="0" x2="${dir > 0 ? 0 : 1}" y2="0"><stop offset="0" stop-color="#FFFDF7"/><stop offset="0.55" stop-color="${C.paperDark}"/><stop offset="1" stop-color="#D9CCB0"/></linearGradient>` +
            `<linearGradient id="${sid}" x1="${dir > 0 ? 0 : 1}" y1="0" x2="${dir > 0 ? 1 : 0}" y2="0"><stop offset="0" stop-color="#3a2f1c" stop-opacity="0.28"/><stop offset="1" stop-color="#3a2f1c" stop-opacity="0"/></linearGradient></defs>` +
            inn() +
            `<rect x="${f(dir > 0 ? xf - 10 : xf - 90)}" y="${f(v.y - 40)}" width="100" height="${f(v.h + 80)}" fill="url(#${sid})"/>` +
            `<g clip-path="url(#pgC)">${out()}</g>` +
            (fw > 2 ? `<path d="${flap}" fill="url(#${gid})" stroke="${C.ink}" stroke-width="3" stroke-opacity="0.35"/>` : '');
        }
        case 'match': {
          const sA = A && cu.from ? this.toScreen(A, t, cu.from) : [0, 0], sB = B && cu.to ? this.toScreen(B, t, cu.to) : sA;
          const kz = E.inOut(p);
          const zA = 1 + 0.35 * kz, zB = 1.35 - 0.35 * kz;
          const mix = E.sineInOut(clamp((p - 0.3) / 0.4));
          const g = (pt, z) => `translate(${fp(pt[0])} ${fp(pt[1])}) scale(${fp(z)}) translate(${fp(-pt[0])} ${fp(-pt[1])})`;
          return `<g transform="${g(sA, zA)}">${out()}</g><g transform="${g(sB, zB)}" opacity="${f(mix)}">${inn()}</g>`;
        }
        default: return t < cu.at ? out() : inn();
      }
    }

    _titleSVG(tx, i, t) {
      if (t < tx.at || t > tx.until) return '';
      const op = Math.min(clamp((t - tx.at) / 0.35), clamp((tx.until - t) / 0.4));
      const k = tx.write > 0 ? E.quintOut(clamp((t - tx.at) / tx.write)) : 1;
      const wEst = measure(tx.str, tx.size) + tx.size;
      const id = `ft${i}`;
      return `<g data-qc="hud"><clipPath id="${id}"><rect x="${f(tx.x - wEst / 2)}" y="${f(tx.y - tx.size * 1.2)}" width="${f(wEst * k)}" height="${f(tx.size * 1.8)}"/></clipPath>` +
        `<text x="${f(tx.x)}" y="${f(tx.y)}" text-anchor="middle" font-family="Caveat, cursive" font-size="${tx.size}" font-weight="${tx.weight}" fill="${tx.color}" opacity="${f(op)}" clip-path="url(#${id})" paint-order="stroke" stroke="${C.paper}" stroke-width="${f(tx.size * 0.12)}" stroke-linejoin="round">${esc(tx.str)}</text></g>`;
    }

    _captionSVG(t) {
      const cfg = this.capCfg; if (!cfg || !this.capChunks) return '';
      const ch = this.capChunks.find((c) => t >= c.t0 && t < c.t1);
      if (!ch) return '';
      const fin = E.backOut(clamp((t - ch.t0) / 0.18)), fout = clamp((ch.t1 - t) / 0.12);
      let size = cfg.size;
      const space = size * 0.28;
      const widths = ch.words.map((w) => measure(w.w, size));
      let total = widths.reduce((a, b) => a + b, 0) + space * (ch.words.length - 1);
      if (total > cfg.maxWidth) { const k = cfg.maxWidth / total; size *= k; widths.forEach((w, i) => (widths[i] = w * k)); total = cfg.maxWidth; }
      let x = -total / 2, s = '';
      ch.words.forEach((w, i) => {
        const active = t >= w.t0 && t < (i + 1 < ch.words.length ? ch.words[i + 1].t0 : ch.t1);
        const said = t >= w.t0;
        const pop = active ? 1 + 0.14 * Math.sin(Math.PI * clamp((t - w.t0) / 0.22)) : 1;
        const cx = x + widths[i] / 2;
        s += `<text x="${f(cx)}" y="0" text-anchor="middle" transform="translate(0 0) scale(1)" font-family="Caveat, cursive" font-weight="700" font-size="${f(size * pop)}" fill="${active ? cfg.highlight : cfg.color}" opacity="${said ? 1 : 0.55}" paint-order="stroke" stroke="${cfg.stroke}" stroke-width="${f(size * 0.16)}" stroke-linejoin="round">${esc(w.w)}</text>`;
        x += widths[i] + space;
      });
      const sc = 0.86 + 0.14 * fin;
      return `<g data-qc="cap" transform="translate(0 ${f(cfg.y)}) scale(${fp(sc)})" opacity="${f(Math.min(1, fin * 1.4) * fout)}">${s}</g>`;
    }

    /** Full frame contents (inside the stage root) at time t. */
    frame(t) {
      const v = (this.stage && this.stage.view) || this.view;
      this.view = v;
      let s = '';
      const cu = this.cuts.find((c) => c.dur > 0 && t >= c.at - c.dur / 2 && t < c.at + c.dur / 2);
      if (cu) s += this._transitionSVG(cu, t, v);
      else { const sh = this._shotAt(t); if (sh) s += this._shotSVG(sh, t, v, 'tS'); }
      // smash cut: one bright frame + shake is added by the incoming shot's camera
      for (const c of this.cuts) if (c.type === 'smash' && t >= c.at && t < c.at + 0.12) s += `<rect x="${f(v.x - 20)}" y="${f(v.y - 20)}" width="${f(v.w + 40)}" height="${f(v.h + 40)}" fill="#FFFFFF" opacity="${f(0.85 * (1 - (t - c.at) / 0.12))}"/>`;
      for (const h of this.huds) s += h(t, v) || '';
      this.titles.forEach((tx, i) => (s += this._titleSVG(tx, i, t)));
      s += this._captionSVG(t);
      return s;
    }

    render(t) {
      this.t = t;
      const st = this.stage;
      if (!st || !st.root) return;
      st.t = t;
      const D = this.duration;
      const fi = this.fadeIn > 0 ? E.quintOut(clamp(t / this.fadeIn)) : 1;
      const fo = this.fadeOut > 0 ? E.sineInOut(clamp((D - t) / this.fadeOut)) : 1;
      const op = Math.min(fi, fo);
      st.root.setAttribute('opacity', fp(op));
      st.root.setAttribute('transform', `scale(${fp(0.92 + 0.08 * op)})`);
      st.root.innerHTML = `<g>${this.frame(t)}</g>`;
    }

    /** Standalone SVG of one frame (headless previews / thumbnails). */
    svgFrame(t, W = 1080, H = 1920) {
      const a = W / H, vw = a >= 1 ? 1000 * a : 1000, vh = a >= 1 ? 1000 : 1000 / a;
      this.view = { x: -vw / 2, y: -vh / 2, w: vw, h: vh };
      const D = this.duration;
      const op = Math.min(this.fadeIn > 0 ? E.quintOut(clamp(t / this.fadeIn)) : 1, this.fadeOut > 0 ? E.sineInOut(clamp((D - t) / this.fadeOut)) : 1);
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${f(-vw / 2)} ${f(-vh / 2)} ${f(vw)} ${f(vh)}">` +
        `<style>.sb-draw [pathLength]{stroke-dasharray:1 1;stroke-dashoffset:var(--o)}.sb-draw .f{fill-opacity:var(--fo)}</style>` +
        `<rect x="${f(-vw / 2)}" y="${f(-vh / 2)}" width="${f(vw)}" height="${f(vh)}" fill="${C.paper}"/>` +
        `<g opacity="${fp(op)}" transform="scale(${fp(0.92 + 0.08 * op)})">${this.frame(t)}</g></svg>`;
    }

/* ---------------------------------------------------------------- drawing helpers */
// right-hand position of a character in world units (forward kinematics on the same rig scribble.js uses)
function handR(ch, t) {
  const st = ch.stateAt(t), p = st.pose;
  const drop = (l) => RIG.thigh * Math.cos(rad(l[0])) + RIG.shin * Math.cos(rad(l[1]));
  const hipY = -Math.max(drop(p.lL), drop(p.lR)) - (p.jump || 0);
  const up = [Math.sin(rad(p.lean)), -Math.cos(rad(p.lean))];
  const sh = [up[0] * RIG.torso, hipY + up[1] * RIG.torso];
  const a1 = p.aR[0] - p.lean, a2 = p.aR[1] - p.lean;
  const j = [sh[0] + Math.sin(rad(a1)) * RIG.upperArm, sh[1] + Math.cos(rad(a1)) * RIG.upperArm];
  const e = [j[0] + Math.sin(rad(a2)) * RIG.foreArm, j[1] + Math.cos(rad(a2)) * RIG.foreArm];
  return [st.x + e[0] * st.scale * st.facing, st.y + e[1] * st.scale];
}
const handsMid = (ch, t) => handR(ch, t); // kites carried in front sit at the right hand

// the kite: paper diamond, two spars, a tail with bows. o: { torn, patches (0-3), bows (0-4), flip (-1..1), dim }
function kite(t, x, y, rot, sc, o = {}) {
  const bows = o.bows == null ? 4 : o.bows, drift = o.drift == null ? 2.5 : o.drift, ph = o.ph || 0, wav = o.wave == null ? 1 : o.wave;
  let d = 'M0 78', pts = [];
  for (let i = 1; i <= 12; i++) { const yy = 78 + i * 16, xx = (Math.sin(t * 5.2 + i * 0.75 + ph) * (3 + i * 1.5)) * wav - i * drift; d += `L${f1(xx)} ${f1(yy)}`; pts.push([xx, yy]); }
  let s = sv.path(d, { w: 3.5 });
  for (let b = 0; b < bows; b++) { const p = pts[2 + b * 3]; s += sv.g(sv.path('M-10 -6 L10 6 L10 -6 L-10 6 Z', { fill: C.paperDark, w: 3 }), `translate(${f1(p[0])} ${f1(p[1])}) rotate(${f1(Math.sin(t * 4 + b) * 14)})`); }
  let body = sv.path('M0 -72 L48 -12 L0 80 L-48 -12 Z', { fill: '#FFFFFF', w: 5 }) + sv.path('M-48 -12 L48 -12 L0 80 Z', { fill: C.paperDark, w: 0.01 }) +
    sv.path('M0 -72 L48 -12 L0 80 L-48 -12 Z', { w: 5 }) + sv.line(0, -72, 0, 80, 3.5) + sv.line(-48, -12, 48, -12, 3.5);
  if (o.torn) body += sv.path('M-30 -30 L-18 -18 L-24 -6 L-8 4 L-14 16 L2 28', { w: 3.5 }) + sv.path('M-8 4 L4 -4 L-2 12 Z', { fill: C.paperDark, w: 3 });
  const P = [[-20, -26, -8], [16, 2, 10], [-10, 36, -4]];
  for (let i = 0; i < (o.patches || 0); i++) {
    const k = o.patchK ? o.patchK[i] : 1; if (k <= 0) continue;
    const [px, py, pr] = P[i];
    body += sv.g(sv.path('M-13 -10 L13 -11 L14 10 L-12 11 Z', { fill: '#F3ECDD', w: 3 }) + sv.path('M-9 -6 l4 4 m0 -4 l-4 4 M5 -7 l4 4 m0 -4 l-4 4 M-8 4 l4 4 m0 -4 l-4 4 M6 3 l4 4 m0 -4 l-4 4', { w: 2 }),
      `translate(${px} ${py}) rotate(${pr}) scale(${f1(E.backOut(clamp(k)))})`);
  }
  const fx = o.flip == null ? 1 : o.flip;
  s = sv.g(s + body, `scale(${(Math.abs(fx) < 0.06 ? 0.06 * Math.sign(fx || 1) : fx).toFixed(3)} 1)`);
  return sv.g(s, `translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${(+sc).toFixed(3)})`, o.op != null ? ` opacity="${o.op.toFixed(2)}"` : '');
}
// the bridle point (where the string ties on) in world units
const bridle = (x, y, rot, sc) => { const a = rad(rot); return [x + (-Math.sin(a) * 8) * sc, y + (Math.cos(a) * 8) * sc]; };
function kiteString(h, k, sag = 0.1, w = 2.6) {
  const mx = (h[0] + k[0]) / 2, my = (h[1] + k[1]) / 2 + Math.hypot(k[0] - h[0], k[1] - h[1]) * sag;
  return `<path d="M${f1(h[0])} ${f1(h[1])} Q${f1(mx)} ${f1(my)} ${f1(k[0])} ${f1(k[1])}" fill="none" stroke="${C.ink}" stroke-width="${w}" stroke-linecap="round" opacity="0.85"/>`;
}
const bob = (t, s = 0) => [fbm(t * 0.7 + s, 2) * 22, fbm(t * 0.55 + s + 4, 3) * 16, fbm(t * 0.9 + s + 9, 5) * 9];
const crashedKite = (t, x, o = {}) => kite(t, x, G - 26, 72, o.sc || 0.62, Object.assign({ wave: 0.15, drift: -1 }, o));

// wind streaks blowing right
function wind(t, v, o = {}) {
  const n = o.n || 14, sp = o.speed || 700, y0 = o.y0 == null ? v.y + 40 : o.y0, y1 = o.y1 == null ? v.y + v.h * 0.7 : o.y1;
  let d = '';
  for (let i = 0; i < n; i++) {
    const span = v.w + 900, x = v.x - 450 + ((((H(i) * 0.5 + 0.5) * span + t * sp * (0.75 + 0.5 * Math.abs(H(i * 2.1)))) % span) + span) % span;
    const y = y0 + (H(i * 3.7) * 0.5 + 0.5) * (y1 - y0) + Math.sin(t * 2 + i) * 10, L = 80 + 70 * Math.abs(H(i * 5.3));
    d += `M${f1(x)} ${f1(y)}q${f1(L * 0.5)} ${f1(-12 - 6 * H(i))} ${f1(L)} 0` + (i % 3 === 0 ? `q${f1(L * 0.18)} ${f1(-2)} ${f1(L * 0.16)} -16` : '');
  }
  return sv.path(d, { w: o.w || 3, op: o.op == null ? 0.32 : o.op });
}
function leaves(t, v, o = {}) {
  const n = o.n || 6, sp = o.speed || 420; let s = '';
  for (let i = 0; i < n; i++) {
    const span = v.w + 700, x = v.x - 350 + ((((H(i * 1.3) * 0.5 + 0.5) * span + t * sp * (0.8 + 0.4 * Math.abs(H(i)))) % span) + span) % span;
    const y = v.y + v.h * (0.15 + 0.6 * (H(i * 7.7) * 0.5 + 0.5)) + Math.sin(t * 3 + i * 2) * 40;
    s += sv.g(sv.path('M-12 0 Q0 -10 12 0 Q0 10 -12 0 Z M-12 0 L12 0', { fill: o.fill || '#B9C98F', w: 3 }), `translate(${f1(x)} ${f1(y)}) rotate(${f1(t * 240 + i * 50)})`);

}
function snow(t, v, o = {}) {

  for (let i = 0; i < n; i++) { const x = v.x + (H(i * 2.7) * 0.5 + 0.5) * v.w + Math.sin(t * 1.5 + i) * 20, y = v.y + ((((H(i * 4.1) * 0.5 + 0.5) * (v.h + 60) + t * 120) % (v.h + 60)) + (v.h + 60)) % (v.h + 60) - 30; s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(3 + 2 * Math.abs(H(i)))}" fill="#FFFFFF" stroke="${C.ink}" stroke-width="1.5" opacity="0.9"/>`; }
  return s;
}
function birds(t, v, o = {}) {
  let d = ''; const n = o.n || 4;
  for (let i = 0; i < n; i++) { const span = v.w + 400, x = v.x - 200 + ((((H(i * 3.1) * 0.5 + 0.5) * span + t * (o.speed || 90)) % span) + span) % span, y = (o.y || v.y + v.h * 0.25) + H(i * 5) * 60, w = Math.sin(t * 7 + i * 2) * 8; d += `M${f1(x - 14)} ${f1(y - w)}Q${f1(x - 6)} ${f1(y - 6)} ${f1(x)} ${f1(y)}Q${f1(x + 6)} ${f1(y - 6)} ${f1(x + 14)} ${f1(y - w)}`; }
  return sv.path(d, { w: 3.5 });
}
// foreground grass along the bottom of the frame (parallax, blurred)
const grassFG = (t, v, str = 1, op = 1) => {

    d += `M${f1(x)} ${f1(base)}q${f1(sw - 6)} ${f1(-h * 0.6)} ${f1(sw * 1.6)} ${f1(-h)}M${f1(x + 7)} ${f1(base)}q${f1(sw + 4)} ${f1(-h * 0.7)} ${f1(sw * 2)} ${f1(-h * 1.2)}`;
  }

};
const hill = (v, fill = '#F3ECDD') => sv.path(`M${f1(v.x - 120)} ${G + 2600} L${f1(v.x - 120)} ${G + 100} C-640 ${G + 12} -320 ${G} 0 ${G} C320 ${G} 640 ${G + 18} ${f1(v.x + v.w + 120)} ${G + 110} L${f1(v.x + v.w + 120)} ${G + 2600} Z`, { fill, w: 5 });
const bench = (x) => sv.path(`M${x - 92} ${G - 74} L${x + 92} ${G - 74} L${x + 92} ${G - 62} L${x - 92} ${G - 62} Z`, { fill: C.brown, w: 4 }) +
  sv.line(x - 78, G - 62, x - 82, G, 6) + sv.line(x + 78, G - 62, x + 82, G, 6) + sv.line(x - 84, G - 74, x - 88, G - 150, 5) + sv.line(x + 84, G - 74, x + 88, G - 150, 5) +
  sv.path(`M${x - 92} ${G - 150} L${x + 92} ${G - 150} L${x + 92} ${G - 128} L${x - 92} ${G - 128} Z`, { fill: C.brown, w: 4 });
const capOn = (x, y, sc = 1.4, rot = 0) => sv.g(CAP, `translate(${x} ${y}) rotate(${rot}) scale(${sc})`);
const sunAt = (t, x, y, sc) => sv.g(S.propSVG('sun', t), `translate(${f1(x)} ${f1(y)}) scale(${sc})`);
const desk = (x, top = 112, w = 150) => sv.path(`M${x - w} ${top} L${x + w} ${top} L${x + w} ${top + 14} L${x - w} ${top + 14} Z`, { fill: C.brown, w: 5 }) +
  sv.line(x - w + 20, top + 14, x - w + 14, G, 6) + sv.line(x + w - 20, top + 14, x + w - 14, G, 6);

    sv.path(`M${x - w / 2} ${y - h / 2} H${x + w / 2} V${y + h / 2} H${x - w / 2} Z M${x} ${y - h / 2} V${y + h / 2} M${x - w / 2} ${y} H${x + w / 2}`, { w: 7 }) +

function skyline(v, o = {}) {

s17.custom((t, sc) => sv.path(`M${f1(sc.view.x - 60)} ${f1(sc.view.y - 60)} H${f1(sc.view.x + sc.view.w + 60)} V${f1(sc.view.y + sc.view.h + 60)} H${f1(sc.view.x - 60)} Z`, { fill: '#EFE6D2', w: 0.01 }), 'back');
const NOTE = [
  ['For the day the wind', 94.26, 95.15, -168, 52],
  ['gets strong:', 95.15, 95.9, -92, 52],
  ["don't fight it.", 95.9, 96.7, -10, 58],
  ['Let it lift you.', 96.7, 97.74, 84, 74],
  ['Grandpa', 98.2, 98.8, 178, 50]
];
s17.custom((t) => {
  let s = sv.g(sv.path('M-370 -250 L366 -262 L376 252 L-362 262 Z', { fill: '#FFFFFF', w: 5 }) + sv.path('M-2 -256 L4 258', { w: 2, op: 0.25 }) + sv.path('M-370 -2 L374 -6', { w: 2, op: 0.18 }) +
    sv.path('M-330 -186 L330 -192 M-330 -96 L330 -100 M-330 -4 L330 -8 M-330 92 L330 88 M-330 186 L330 182', { w: 2, op: 0.12 }), 'rotate(-2)');
  NOTE.forEach(([str, a, b, y, size], i) => {
    const k = clamp((t - a) / (b - a));
    if (k <= 0) return;
    const x0 = i === 4 ? 40 : -320, w = 700;
    s += `<clipPath id="nl${i}"><rect x="${x0 - 20}" y="${y - size}" width="${f1((w + 40) * k)}" height="${size * 1.5}"/></clipPath>` +
      `<g clip-path="url(#nl${i})" transform="rotate(-2)"><text x="${x0}" y="${y}" font-family="Caveat, cursive" font-weight="700" font-size="${size}" fill="${C.ink}">${i === 4 ? '— ' + str : str}</text></g>`;
  });
  const ku = clamp((t - 97.8) / 0.5); if (ku > 0) s += `<g class="sb-draw" style="--o:${(1 - E.inOut(ku)).toFixed(3)};--fo:1" transform="rotate(-2)">` + sv.path('M-322 104 Q-120 94 150 102', { w: 4 }) + '</g>';
  const kk = clamp((t - 98.7) / 0.8); if (kk > 0) s += sv.g(kite(t, 0, 0, -14, 0.5, { bows: 2, wave: 0.6 }), 'translate(272 -130)', ` opacity="${kk.toFixed(2)}"`);
  return s;
}, 'front');
s17.tint(93.3, 0, '#7D88A6', 0.22).tint(95.5, 3.5, C.ochre, 0.12);
s17.cam.push(93.5, 6.4, 1.1, [-20, -20]).tilt(93.5, 6.4, 1.6, 'sineInOut');
film.cue('sfx', 94.2, { name: 'scribble', gain: 0.07, d: 1.6 }).cue('sfx', 95.95, { name: 'scribble', gain: 0.06, d: 0.75 }).cue('sfx', 96.75, { name: 'scribble', gain: 0.07, d: 1.0 }).cue('sfx', 98.2, { name: 'scribble', gain: 0.05, d: 0.6 }).cue('sfx', 98.8, { name: 'pluck', gain: 0.14, note: 72 });
film.cut(B(120), 'dissolve', { dur: 1.0 });

/* SHOT 18 · memory: Grandpa and little Scribble holding the string together (B120 → B124) */
const s18 = film.shot(B(120), B(124), { name: 'memory', frame: [-20, 90, 820, 820], groundLine: false });
hillSet(s18, { wind: 300, windN: 6, windOp: 0.2, sun: [-380, -330, 1.0], grass: true });
const g18 = s18.character(gpOpts({ x: -150, pose: 'gpCrouchHold', expr: 'happy', look: [4, 1] }));
const k18 = s18.character(kidOpts({ x: 30, pose: 'kiteHold', expr: 'happy', look: [3, -6] }));
k18.look(101.4, [-4, 1]).expr(101.5, 'excited').look(102.6, [3, -6]);
g18.look(100.6, [4, 1]).expr(102.0, 'proud');
const kite18 = (t) => { const b = bob(t, 18); return [300 + b[0], -270 + b[1], -12 + b[2]]; };
s18.custom((t) => { const [x, y, r] = kite18(t), K = bridle(x, y, r, 0.6); return kiteString(handR(g18, t), K, 0.1, 2) + kiteString(handR(k18, t), K, 0.1, 2.2) + kite(t, x, y, r, 0.6, { bows: 3 }); }, 'front');
s18.custom((t, sc) => vignette('vig18', sc.view, 0.9), 'front');
s18.tint(100, 0, C.ochre, 0.24);
s18.cam.push(100.0, 3.4, 1.07, [-40, 100]);
film.cut(B(124), 'dissolve', { dur: 1.0 });

/* SHOT 19 · back in the attic: tears, then a small smile (B124 → B128) */
const s19 = film.shot(B(124), B(128), { name: 'decide', frame: [10, -40, 380, 380] });
atticSet(s19);
const k19 = s19.character({ x: 20, scale: ADULT, pose: 'readNote', hold: 'note', expr: 'tearful', facing: -1, look: [-2, 4] });
k19.expr(104.3, 'calm').expr(105.3, 'soft').look(105.3, [-4, 0]).pose(105.75, 'nod', { dur: 0.18 }).pose(106.05, 'readNote', { dur: 0.25 });
s19.tint(103.3, 0, C.ochre, 0.14);
s19.cam.push(103.4, 3.3, 1.08, [10, -50]);
film.cut(B(128), 'cut');

/* ===================== ACT 4 · ONE PATCH AT A TIME ===================== */

/* SHOT 20 · the workbench at dawn (B128 → B132) */
const s20 = film.shot(B(128), B(132), { name: 'bench', frame: [10, 70, 820, 820] });
s20.custom((t, sc) => F2.bg.floorboards(sc.view, { y: G }) + windowFrame('w20', -300, -170, 300, 250, F2.bg.sky({ x: -460, y: -300, w: 320, h: 270 }, '#F6E7C8') +
  sunAt(t, -300, f1(-60 - 40 * clamp((t - 106.7) / 3.3)), 0.8) + F2.bg.hills({ x: -460, y: -300, w: 320, h: 270 }, { y: -70, h: 50, seed: 4, op: 0.4 })), 'back');
const PATCH_T = [107.55, 108.35, 109.15];
s20.custom((t) => desk(130) + sv.path('M230 112 L230 40 L262 10', { w: 5 }) + sv.path('M246 0 L290 22 L276 40 L232 18 Z', { fill: C.ochre, w: 4 }) +
  kite(t, 120, 20, 0, 0.92, { torn: true, bows: 2, wave: 0.15, drift: 0.4, patches: 3, patchK: PATCH_T.map((p) => (t - p) / 0.3) }), 'back');
s20.prop('stool', { x: -90, scale: 1.08, draw: 0 });
const k20 = s20.character({ x: -90, scale: ADULT, pose: 'deskWork', expr: 'thinking', look: [4, 0] });
PATCH_T.forEach((p) => k20.pose(p - 0.35, 'deskReach', { dur: 0.2 }).pose(p + 0.05, 'deskWork', { dur: 0.25 }));
k20.expr(108.6, 'soft').expr(109.6, 'happy');
s20.tint(106.7, 0, C.ochre, 0.1);
s20.cam.push(106.8, 3.2, 1.08, [40, 40]);
PATCH_T.forEach((p) => film.cue('sfx', p, { name: 'paper_fold', gain: 0.14, pan: 0.2 }).cue('sfx', p + 0.02, { name: 'pop', gain: 0.06 }));
film.cut(B(132), 'cut');

/* SHOT 21 · close-up: new tail bows, then the kite lifts (B132 → B136) */
const s21 = film.shot(B(132), B(136), { name: 'tail', frame: [0, 40, 620, 620], groundLine: false });
s21.custom((t, sc) => sv.path(`M${f1(sc.view.x - 60)} ${f1(sc.view.y - 60)} H${f1(sc.view.x + sc.view.w + 60)} V${f1(sc.view.y + sc.view.h + 60)} H${f1(sc.view.x - 60)} Z`, { fill: '#E7D3B3', w: 0.01 }) +
  sv.path('M-600 -10 L600 -10 M-600 160 L600 160', { w: 3, op: 0.15 }), 'back');
const BOW_T = [110.35, 110.95, 111.55, 112.15];
s21.custom((t) => {
  const nb = BOW_T.filter((b) => t >= b).length, lift = E.expoIn(clamp((t - 112.6) / 0.6));
  return kite(t, 0, -60 - lift * 900, -4 + lift * 10, 2.3, { torn: true, patches: 3, bows: nb, wave: 0.25 + lift, drift: 0.6 });
}, 'front');
s21.tint(110, 0, C.ochre, 0.08);
s21.cam.push(110.1, 3.0, 1.06, [0, 20]);
BOW_T.forEach((b, i) => film.cue('sfx', b, { name: 'pluck', gain: 0.1, note: 72 + [0, 2, 4, 7][i] }));
film.cue('sfx', 112.6, { name: 'swish', gain: 0.24 });
film.cut(B(136), 'page', { dir: 1 });

/* SHOT 22 · the hill, morning, strong wind (B136 → B142) */
const s22 = film.shot(B(136), B(142), { name: 'morning', frame: [0, 60, 1000, 1000], groundLine: false });
hillSet(s22, { tree: 420, treeScale: 2.4, bench: 330, cap: true, wind: 1000, windN: 20, windOp: 0.36, leaves: 7, cloudSpeed: 46, grassStr: 1.8, sun: [-400, -300, 1.1] });
const k22 = s22.character({ x: -470, scale: ADULT, pose: 'carryKite', expr: 'neutral', look: [4, -1] });
k22.walk(113.6, 116.2, -140, { keepArms: true }).look(116.3, [5, 1]).expr(116.4, 'soft').look(117.2, [3, -5]).pose(117.4, 'kiteRaise', { dur: 0.45, expr: 'neutral' });
s22.custom((t) => {
  const h = handR(k22, t);
  if (t < 117.95) return kite(t, h[0] + 8, h[1] - 52, -4, 0.66, { patches: 3, torn: true, bows: 4, wave: 1.4, drift: 4 });
  const k = E.quintOut(clamp((t - 117.95) / 0.45)), x = h[0] + 8 + 140 * k, y = h[1] - 52 - 160 * k;
  return kiteString(h, bridle(x, y, -4 - 20 * k, 0.66), 0.03) + kite(t, x, y, -4 - 20 * k, 0.66, { patches: 3, torn: true, bows: 4, wave: 1.6, drift: 5 });
}, 'front');
s22.cam.frame(115.9, 2.4, [-90, 90, 820, 820], 'quintInOut');
film.cue('sfx', 117.95, { name: 'whoosh', gain: 0.32, pan: 0.3 });
film.cut(B(142), 'cut');

/* SHOT 23 · he fights the wind and loses (B142 → B147) */
const s23 = film.shot(B(142), B(147), { name: 'fight', frame: [40, 30, 820, 820], groundLine: false, handheld: 1.3 });
hillSet(s23, { wind: 1200, windN: 22, windOp: 0.4, leaves: 8, cloudSpeed: 60, grassStr: 2 });
const k23 = s23.character({ x: -140, scale: ADULT, pose: 'pullBack', expr: 'angry', look: [4, -4] });
k23.pose(119.6, 'dragged', { dur: 0.14, expr: 'scared' }).moveTo(119.6, 0.45, -40, null, 'expoOut').pose(120.15, 'pullBack', { dur: 0.25, expr: 'angry' })
  .expr(120.6, 'scared').pose(121.45, 'crouch', { dur: 0.25, expr: 'sad' }).look(121.5, [5, 3]);
const kite23 = (t) => {
  const j = [fbm(t * 3.1, 7) * 120, fbm(t * 2.6, 9) * 100, fbm(t * 4.0, 11) * 40];
  if (t < 119.6) return [200 + j[0], -250 + j[1], -14 + j[2], false];
  if (t < 120.4) { const k = E.expoOut(clamp((t - 119.6) / 0.4)); return [lerp(200, 330, k) + j[0] * 0.6, lerp(-250, -330, k) + j[1] * 0.6, -30 + j[2], false]; }
  const k = clamp((t - 120.4) / 1.0), x = lerp(330, 360, k), y = lerp(-330, G - 26, E.expoIn(k));
  return t < 121.4 ? [x, y, -30 + 420 * E.expoIn(k), false] : [360, G - 26, 72, true];
};
s23.custom((t) => { const [x, y, r, down] = kite23(t), h = handR(k23, t); return kiteString(h, bridle(x, y, r, 0.62), down ? 0.06 : 0.015) + (down ? crashedKite(t, x, { patches: 3, torn: true, sc: 0.6, bows: 4 }) : kite(t, x, y, r, 0.62, { patches: 3, torn: true, bows: 4, wave: 2, drift: 5 })); }, 'front');
s23.cam.shake(119.6, 0.4, 12).shake(121.4, 0.4, 10).frame(121.45, 0.95, [-20, 80, 760, 760], 'sineInOut');
film.cue('sfx', 119.6, { name: 'whoosh', gain: 0.32, pan: 0.5 }).cue('sfx', 120.4, { name: 'dark_whoosh', gain: 0.18, d: 1.0, pan: 0.4 })
  .cue('sfx', 121.4, { name: 'thump_soft', gain: 0.45, pan: 0.45 }).cue('sfx', 121.5, { name: 'thud', gain: 0.24, pan: -0.1 });
film.cut(B(147), 'cut');

/* SHOT 24 · close-up: he stops fighting. A memory stands behind him (B147 → B151) */
const s24 = film.shot(B(147), B(151), { name: 'remember', frame: [-90, 10, 500, 500], groundLine: false });
hillSet(s24, { wind: 900, windN: 14, windOp: 0.3, leaves: 4, grass: false, cloudSpeed: 40 });
const ghost = s24.character(gpOpts({ x: -200, pose: 'gpHand', expr: 'soft', opacity: 0, look: [4, 3], motion: { breathe: 0.5 } }));
ghost.fade(123.0, 0.9, 0.32).fade(124.7, 0.7, 0);
const k24 = s24.character({ x: -20, scale: ADULT, pose: 'crouch', expr: 'sad', look: [3, 3] });
k24.expr(122.75, 'eyesShut').look(122.8, [0, 2]).expr(124.55, 'soft').look(124.6, [4, -4]).pose(125.05, 'idle', { dur: 0.5, expr: 'soft' });
s24.cam.push(122.6, 2.3, 1.04, [-90, 20]).frame(124.95, 0.8, [-50, -40, 600, 600], 'quintInOut');
film.cue('sfx', 123.0, { name: 'chime', gain: 0.08, pan: -0.3 });
film.cut(B(151), 'whip', { dir: 1 });

/* SHOT 25 · he runs WITH the wind — the kite rises (B151 → B159) */
const s25 = film.shot(B(151), B(159), { name: 'run2', frame: [-140, 70, 1000, 1000], groundLine: false });
hillSet(s25, { tree: 470, treeScale: 2.3, bench: 370, cap: true, wind: 900, windN: 18, windOp: 0.32, cloudSpeed: 40, grassStr: 1.5, birds: true, sun: [380, -360, 1.2] });
const k25 = s25.character({ x: -460, scale: ADULT, pose: 'kiteHold', expr: 'soft' });
k25.walk(126.0, 129.6, 140, { run: true, keepArms: true }).expr(127.4, 'excited').pose(129.7, 'lookUpHold', { dur: 0.4, expr: 'excited' }).look(129.7, [3, -6]).expr(131.0, 'happy');
const kite25 = (t) => {
  const h = handR(k25, t), b = bob(t, 25);
  if (t < 126.8) return [h[0] - 170, Math.min(G - 30, h[1] + 60) - Math.abs(Math.sin(t * 8)) * 14, -60];
  const k = E.quintOut(clamp((t - 126.8) / 3.2));
  return [h[0] + lerp(-170, 120, k) + b[0] * k, lerp(Math.min(G - 30, h[1] + 60), h[1] - 470, k) + b[1] * k, lerp(-60, -12, k) + b[2] * k];
};
s25.custom((t) => { const [x, y, r] = kite25(t); return kiteString(handR(k25, t), bridle(x, y, r, 0.66), t < 126.8 ? 0.03 : 0.08) + kite(t, x, y, r, 0.66, { patches: 3, torn: true, bows: 4, wave: 1.2, drift: 3 }); }, 'front');
s25.cam.follow(126.0, 129.8, k25, { dx: 60, lag: 0.4 }).frame(129.6, 1.8, [100, -110, 1000, 1000], 'quintInOut');
film.cue('sfx', 126.8, { name: 'whoosh', gain: 0.26, pan: 0.2 }).cue('sfx', 128.3, { name: 'flap', gain: 0.18, pan: 0.4 }).cue('sfx', 130.0, { name: 'flap', gain: 0.15, pan: 0.5 });
const k25end = kite25(B(159));
film.cut(B(159), 'match', { from: [k25end[0], k25end[1]], to: [-40, -150] });

/* SHOT 26 · it soars (B159 → B163) */
const s26 = film.shot(B(159), B(163), { name: 'soar', frame: [20, -170, 760, 760], groundLine: false });
s26.layer(0.15, (t, v) => sunAt(t, 300, -330, 1.5));
s26.layer(0.45, (t, v) => F2.bg.clouds(t, v, { n: 5, y: -260, speed: 70 }));
s26.layer(0.75, (t, v) => F2.bg.clouds(t + 9, v, { n: 3, y: 60, speed: 110 }));
s26.layer(0.6, (t, v) => birds(t, v, { n: 4, y: -330, speed: 120 }));
s26.layer(0.9, (t, v) => wind(t, v, { speed: 900, n: 14, op: 0.26 }));
const kite26 = (t) => { const k = clamp((t - 132.5) / 3.4), b = bob(t, 26); return [lerp(-40, 120, E.sineInOut(k)) + b[0], lerp(-150, -250, E.sineInOut(k)) + b[1], -14 + b[2]]; };
s26.custom((t) => { const [x, y, r] = kite26(t), K = bridle(x, y, r, 1.05); return kiteString(K, [K[0] - 520, K[1] + 1100], -0.04, 3) + kite(t, x, y, r, 1.05, { patches: 3, torn: true, bows: 4, wave: 1.1, drift: 3 }); }, 'front');
s26.cam.frame(132.6, 3.2, [60, -200, 900, 900], 'sineInOut');
film.cut(B(163), 'cut');

/* ===================== ACT 5 · IN THE WIND ===================== */

/* SHOT 27 · he hands the string to a child (B163 → B171) */
const s27 = film.shot(B(163), B(171), { name: 'handoff', frame: [60, 70, 900, 900], groundLine: false });
hillSet(s27, { wind: 520, windN: 10, windOp: 0.24, cloudSpeed: 18, birds: true });
const k27 = s27.character({ x: -80, scale: ADULT, pose: 'kiteHold', expr: 'soft', look: [3, -5] });
const kid27 = s27.character({ x: 660, scale: 1.35, scarf: false, hair: 'bun', costume: 'kidtee', facing: -1, expr: 'neutral', look: [-3, 0] });
kid27.walk(135.9, 138.0, 210).look(137.9, [2, -6]).expr(138.0, 'excited').look(138.9, [-4, -1]).walk(139.1, 139.8, 120).face(140.3, 1).pose(140.3, 'kiteHold', { dur: 0.3, expr: 'excited' }).look(140.6, [3, -6]).expr(141.6, 'happy');
k27.look(137.4, [4, 0]).expr(138.2, 'happy').pose(138.9, 'handOver', { dur: 0.5, expr: 'soft' }).look(139.1, [4, 1]).pose(141.0, 'idle', { dur: 0.6, expr: 'happy' }).look(141.2, [3, -5]);
const kite27 = (t) => { const b = bob(t, 27); return [300 + b[0], -330 + b[1], -12 + b[2]]; };
s27.custom((t) => { const [x, y, r] = kite27(t), h = t < 140.3 ? handR(k27, t) : handR(kid27, t); return kiteString(h, bridle(x, y, r, 0.5), 0.12, 2.2) + kite(t, x, y, r, 0.5, { patches: 3, torn: true, bows: 4 }); }, 'front');
s27.tint(135.8, 0, C.ochre, 0.1).tint(136, 6, C.ochre, 0.16);
s27.cam.push(136.0, 6.4, 1.08, [80, 80]);
film.cue('sfx', 140.3, { name: 'pluck', gain: 0.12, note: 76 });
film.cut(B(171), 'dissolve', { dur: 1.2 });

/* SHOT 28 · final wide: "Let it lift you." (B171 → end) */
const s28 = film.shot(B(171), DUR, { name: 'end', frame: [0, 20, 950, 950], groundLine: false });
hillSet(s28, { tree: 430, treeScale: 2.1, bench: 320, cap: true, wind: 420, windN: 8, windOp: 0.2, birds: true, sun: [-380, 140, 1.4], cloudSpeed: 12 });
const k28 = s28.character({ x: -150, scale: 1.75, pose: 'pointUp', expr: 'happy', look: [4, -6] });
const kid28 = s28.character({ x: -40, scale: 1.05, scarf: false, hair: 'bun', costume: 'kidtee', pose: 'kiteHold', expr: 'excited', look: [3, -6] });
k28.pose(145.5, 'idle', { dur: 0.8, expr: 'soft' }).look(145.8, [4, 3]);
const kite28 = (t) => { const b = bob(t, 28); return [210 + b[0], -260 + b[1], -12 + b[2]]; };
s28.custom((t) => { const [x, y, r] = kite28(t); return kiteString(handR(kid28, t), bridle(x, y, r, 0.45), 0.12, 2) + kite(t, x, y, r, 0.45, { patches: 3, torn: true, bows: 4 }); }, 'front');
s28.tint(142.5, 0, C.ochre, 0.18);
s28.cam.frame(142.6, 7.3, [20, -30, 1150, 1150], 'sineInOut');
film.title('Let it lift you.', { at: 144.2, until: 148.9, y: -380, size: 100, write: 1.0 });

film.ready(LINES);
}
