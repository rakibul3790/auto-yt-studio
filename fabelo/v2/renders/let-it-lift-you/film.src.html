/* =====================================================================
   "Let It Lift You" — Fabelo Studio v2 film (150 s, 16:9 first, works at every ratio)
   Every spring Grandpa builds a kite; little Scribble can't make it fly until Grandpa says
   "don't fight the wind, let it lift you". Scribble grows up, gets busy, misses the Sundays.
   Grandpa is gone. In the attic Scribble finds the torn kite and a note. He fixes it,
   fights the strong wind, remembers, runs with it — and hands the string to a child.
   Scribble never speaks. 28 shots, cuts on the 72 bpm grid.

/* ---------------------------------------------------------------- drawing helpers */
// right-hand position of a character in world units (forward kinematics on the same rig scribble.js uses)
function handR(ch, t) {
  const st = ch.stateAt(t), p = st.pose;
  const drop = (l) => RIG.thigh * Math.cos(rad(l[0])) + RIG.shin * Math.cos(rad(l[1]));
  const hipY = -Math.max(drop(p.lL), drop(p.lR)) - (p.jump || 0);
  const up = [Math.sin(rad(p.lean)), -Math.cos(rad(p.lean))];
  const sh = [up[0] * RIG.torso, hipY + up[1] * RIG.torso];
  const a1 = p.aR[0] - p.lean, a2 = p.aR[1] - p.lean;
  const j = [sh[0] + Math.sin(rad(a1)) * RIG.upperArm, sh[1] + Math.cos(rad(a1)) * RIG.upperArm];
  const e = [j[0] + Math.sin(rad(a2)) * RIG.foreArm, j[1] + Math.cos(rad(a2)) * RIG.foreArm];
  return [st.x + e[0] * st.scale * st.facing, st.y + e[1] * st.scale];
}
const handsMid = (ch, t) => handR(ch, t); // kites carried in front sit at the right hand

// the kite: paper diamond, two spars, a tail with bows. o: { torn, patches (0-3), bows (0-4), flip (-1..1), dim }
function kite(t, x, y, rot, sc, o = {}) {
  const bows = o.bows == null ? 4 : o.bows, drift = o.drift == null ? 2.5 : o.drift, ph = o.ph || 0, wav = o.wave == null ? 1 : o.wave;
  let d = 'M0 78', pts = [];
  for (let i = 1; i <= 12; i++) { const yy = 78 + i * 16, xx = (Math.sin(t * 5.2 + i * 0.75 + ph) * (3 + i * 1.5)) * wav - i * drift; d += `L${f1(xx)} ${f1(yy)}`; pts.push([xx, yy]); }
  let s = sv.path(d, { w: 3.5 });
  for (let b = 0; b < bows; b++) { const p = pts[2 + b * 3]; s += sv.g(sv.path('M-10 -6 L10 6 L10 -6 L-10 6 Z', { fill: C.paperDark, w: 3 }), `translate(${f1(p[0])} ${f1(p[1])}) rotate(${f1(Math.sin(t * 4 + b) * 14)})`); }
  let body = sv.path('M0 -72 L48 -12 L0 80 L-48 -12 Z', { fill: '#FFFFFF', w: 5 }) + sv.path('M-48 -12 L48 -12 L0 80 Z', { fill: C.paperDark, w: 0.01 }) +
    sv.path('M0 -72 L48 -12 L0 80 L-48 -12 Z', { w: 5 }) + sv.line(0, -72, 0, 80, 3.5) + sv.line(-48, -12, 48, -12, 3.5);
  if (o.torn) body += sv.path('M-30 -30 L-18 -18 L-24 -6 L-8 4 L-14 16 L2 28', { w: 3.5 }) + sv.path('M-8 4 L4 -4 L-2 12 Z', { fill: C.paperDark, w: 3 });
  const P = [[-20, -26, -8], [16, 2, 10], [-10, 36, -4]];
  for (let i = 0; i < (o.patches || 0); i++) {
    const k = o.patchK ? o.patchK[i] : 1; if (k <= 0) continue;
    const [px, py, pr] = P[i];
    body += sv.g(sv.path('M-13 -10 L13 -11 L14 10 L-12 11 Z', { fill: '#F3ECDD', w: 3 }) + sv.path('M-9 -6 l4 4 m0 -4 l-4 4 M5 -7 l4 4 m0 -4 l-4 4 M-8 4 l4 4 m0 -4 l-4 4 M6 3 l4 4 m0 -4 l-4 4', { w: 2 }),
      `translate(${px} ${py}) rotate(${pr}) scale(${f1(E.backOut(clamp(k)))})`);
  }
  const fx = o.flip == null ? 1 : o.flip;
  s = sv.g(s + body, `scale(${(Math.abs(fx) < 0.06 ? 0.06 * Math.sign(fx || 1) : fx).toFixed(3)} 1)`);
  return sv.g(s, `translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${(+sc).toFixed(3)})`, o.op != null ? ` opacity="${o.op.toFixed(2)}"` : '');
}
// the bridle point (where the string ties on) in world units
const bridle = (x, y, rot, sc) => { const a = rad(rot); return [x + (-Math.sin(a) * 8) * sc, y + (Math.cos(a) * 8) * sc]; };
function kiteString(h, k, sag = 0.1, w = 2.6) {
  const mx = (h[0] + k[0]) / 2, my = (h[1] + k[1]) / 2 + Math.hypot(k[0] - h[0], k[1] - h[1]) * sag;
  return `<path d="M${f1(h[0])} ${f1(h[1])} Q${f1(mx)} ${f1(my)} ${f1(k[0])} ${f1(k[1])}" fill="none" stroke="${C.ink}" stroke-width="${w}" stroke-linecap="round" opacity="0.85"/>`;
}
const bob = (t, s = 0) => [fbm(t * 0.7 + s, 2) * 22, fbm(t * 0.55 + s + 4, 3) * 16, fbm(t * 0.9 + s + 9, 5) * 9];
const crashedKite = (t, x, o = {}) => kite(t, x, G - 26, 72, o.sc || 0.62, Object.assign({ wave: 0.15, drift: -1 }, o));

// wind streaks blowing right
function wind(t, v, o = {}) {
  const n = o.n || 14, sp = o.speed || 700, y0 = o.y0 == null ? v.y + 40 : o.y0, y1 = o.y1 == null ? v.y + v.h * 0.7 : o.y1;
  let d = '';
  for (let i = 0; i < n; i++) {
    const span = v.w + 900, x = v.x - 450 + ((((H(i) * 0.5 + 0.5) * span + t * sp * (0.75 + 0.5 * Math.abs(H(i * 2.1)))) % span) + span) % span;
    const y = y0 + (H(i * 3.7) * 0.5 + 0.5) * (y1 - y0) + Math.sin(t * 2 + i) * 10, L = 80 + 70 * Math.abs(H(i * 5.3));
    d += `M${f1(x)} ${f1(y)}q${f1(L * 0.5)} ${f1(-12 - 6 * H(i))} ${f1(L)} 0` + (i % 3 === 0 ? `q${f1(L * 0.18)} ${f1(-2)} ${f1(L * 0.16)} -16` : '');
  }
  return sv.path(d, { w: o.w || 3, op: o.op == null ? 0.32 : o.op });
}
function leaves(t, v, o = {}) {
  const n = o.n || 6, sp = o.speed || 420; let s = '';
  for (let i = 0; i < n; i++) {
    const span = v.w + 700, x = v.x - 350 + ((((H(i * 1.3) * 0.5 + 0.5) * span + t * sp * (0.8 + 0.4 * Math.abs(H(i)))) % span) + span) % span;
    const y = v.y + v.h * (0.15 + 0.6 * (H(i * 7.7) * 0.5 + 0.5)) + Math.sin(t * 3 + i * 2) * 40;
    s += sv.g(sv.path('M-12 0 Q0 -10 12 0 Q0 10 -12 0 Z M-12 0 L12 0', { fill: o.fill || '#B9C98F', w: 3 }), `translate(${f1(x)} ${f1(y)}) rotate(${f1(t * 240 + i * 50)})`);
  }
  return s;
}
function snow(t, v, o = {}) {
  let s = ''; const n = o.n || 40;
  for (let i = 0; i < n; i++) { const x = v.x + (H(i * 2.7) * 0.5 + 0.5) * v.w + Math.sin(t * 1.5 + i) * 20, y = v.y + ((((H(i * 4.1) * 0.5 + 0.5) * (v.h + 60) + t * 120) % (v.h + 60)) + (v.h + 60)) % (v.h + 60) - 30; s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(3 + 2 * Math.abs(H(i)))}" fill="#FFFFFF" stroke="${C.ink}" stroke-width="1.5" opacity="0.9"/>`; }
  return s;
}
function birds(t, v, o = {}) {
  let d = ''; const n = o.n || 4;
  for (let i = 0; i < n; i++) { const span = v.w + 400, x = v.x - 200 + ((((H(i * 3.1) * 0.5 + 0.5) * span + t * (o.speed || 90)) % span) + span) % span, y = (o.y || v.y + v.h * 0.25) + H(i * 5) * 60, w = Math.sin(t * 7 + i * 2) * 8; d += `M${f1(x - 14)} ${f1(y - w)}Q${f1(x - 6)} ${f1(y - 6)} ${f1(x)} ${f1(y)}Q${f1(x + 6)} ${f1(y - 6)} ${f1(x + 14)} ${f1(y - w)}`; }
  return sv.path(d, { w: 3.5 });
}
// foreground grass along the bottom of the frame (parallax, blurred)
const grassFG = (t, v, str = 1, op = 1) => {
  if (op <= 0.01) return '';
  let d = ''; const base = v.y + v.h + 30;
  for (let i = 0; i < 40; i++) {
    const x = v.x - 60 + i * (v.w + 120) / 40 + H(i) * 18, h = 50 + 46 * Math.abs(H(i * 3)), sw = (Math.sin(t * 2.2 * str + i) * 6 + 10) * str;
    d += `M${f1(x)} ${f1(base)}q${f1(sw - 6)} ${f1(-h * 0.6)} ${f1(sw * 1.6)} ${f1(-h)}M${f1(x + 7)} ${f1(base)}q${f1(sw + 4)} ${f1(-h * 0.7)} ${f1(sw * 2)} ${f1(-h * 1.2)}`;
  }
  return sv.path(d, { w: 6, op: 0.5 * op });
};
const hill = (v, fill = '#F3ECDD') => sv.path(`M${f1(v.x - 120)} ${G + 2600} L${f1(v.x - 120)} ${G + 100} C-640 ${G + 12} -320 ${G} 0 ${G} C320 ${G} 640 ${G + 18} ${f1(v.x + v.w + 120)} ${G + 110} L${f1(v.x + v.w + 120)} ${G + 2600} Z`, { fill, w: 5 });
const bench = (x) => sv.path(`M${x - 92} ${G - 74} L${x + 92} ${G - 74} L${x + 92} ${G - 62} L${x - 92} ${G - 62} Z`, { fill: C.brown, w: 4 }) +
  sv.line(x - 78, G - 62, x - 82, G, 6) + sv.line(x + 78, G - 62, x + 82, G, 6) + sv.line(x - 84, G - 74, x - 88, G - 150, 5) + sv.line(x + 84, G - 74, x + 88, G - 150, 5) +
  sv.path(`M${x - 92} ${G - 150} L${x + 92} ${G - 150} L${x + 92} ${G - 128} L${x - 92} ${G - 128} Z`, { fill: C.brown, w: 4 });
const capOn = (x, y, sc = 1.4, rot = 0) => sv.g(CAP, `translate(${x} ${y}) rotate(${rot}) scale(${sc})`);
const sunAt = (t, x, y, sc) => sv.g(S.propSVG('sun', t), `translate(${f1(x)} ${f1(y)}) scale(${sc})`);
const desk = (x, top = 112, w = 150) => sv.path(`M${x - w} ${top} L${x + w} ${top} L${x + w} ${top + 14} L${x - w} ${top + 14} Z`, { fill: C.brown, w: 5 }) +
  sv.line(x - w + 20, top + 14, x - w + 14, G, 6) + sv.line(x + w - 20, top + 14, x + w - 14, G, 6);
function windowFrame(id, x, y, w, h, inside) {
  return `<clipPath id="${id}"><rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#${id})">${inside}</g>` +
    sv.path(`M${x - w / 2} ${y - h / 2} H${x + w / 2} V${y + h / 2} H${x - w / 2} Z M${x} ${y - h / 2} V${y + h / 2} M${x - w / 2} ${y} H${x + w / 2}`, { w: 7 }) +
    sv.path(`M${x - w / 2 - 20} ${y + h / 2 + 10} H${x + w / 2 + 20}`, { w: 8 });
}
function skyline(v, o = {}) {
  const y = o.y == null ? G : o.y, seed = o.seed || 1, hMax = o.h || 420, col = o.fill || C.paperDark, wcol = o.win || '#FFFFFF';
  let s = '', x = v.x - 120, i = 0;
  while (x < v.x + v.w + 120) {
    const w = 90 + 80 * Math.abs(H(i * 1.7 + seed)), h = hMax * (0.45 + 0.55 * Math.abs(H(i * 2.9 + seed * 3)));
    s += sv.path(`M${f1(x)} ${y} L${f1(x)} ${f1(y - h)} L${f1(x + w)} ${f1(y - h)} L${f1(x + w)} ${y} Z`, { fill: col, w: o.w || 4, op: o.op == null ? 1 : o.op });
    if (o.windows !== false) for (let r = 0; r < Math.floor(h / 46) - 1; r++) for (let c = 0; c < Math.floor(w / 34); c++) {
      const lit = o.lit ? H(i * 13 + r * 7 + c * 3) > 0.2 : true;
      if (lit) s += `<rect x="${f1(x + 12 + c * 34)}" y="${f1(y - h + 18 + r * 46)}" width="14" height="20" fill="${wcol}" stroke="${C.ink}" stroke-width="2" opacity="${o.wop || 0.8}"/>`;
    }

}
const label = (t, str, at, until, x, y, size = 64, rot = -4, write = 0.35) => {
  if (t < at || t > until) return '';
  const k = E.backOut(clamp((t - at) / write)), op = Math.min(clamp((t - at) / 0.2), clamp((until - t) / 0.3));
  return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="${size}" fill="${C.ink}" opacity="${op.toFixed(2)}" transform="rotate(${rot} ${x} ${y}) translate(${x} ${y}) scale(${k.toFixed(3)}) translate(${-x} ${-y})">${str}</text>`;

// a soft paper vignette for the memory shot

// a whole hillside set: far hills, clouds, wind, the hill, optional tree + bench (+ cap), foreground grass
function hillSet(sh, o = {}) {
  const ws = o.wind == null ? 600 : o.wind;
  if (o.sun) sh.layer(0.18, (t, v) => sunAt(t, o.sun[0], o.sun[1], o.sun[2] || 1.2));
  sh.layer(0.35, (t, v) => F2.bg.hills(v, { y: G - 40, h: 120, seed: o.seed || 3, op: 0.28 }));

  if (o.birds) sh.layer(0.55, (t, v) => birds(t, v, { n: 3, y: -280 }));
  sh.custom((t, sc) => hill(sc.view), 'back');
  if (o.tree != null) sh.prop('tree', { x: o.tree, scale: o.treeScale || 2.5, draw: 0 });
  if (o.bench != null) sh.custom((t) => bench(o.bench) + (o.cap ? capOn(o.bench - 30, G - 78, 1.5, -6) : ''), 'back');
  if (ws > 0) sh.layer(0.85, (t, v) => wind(t, v, { speed: ws, n: o.windN || 12, op: o.windOp == null ? 0.28 : o.windOp }));
  if (o.leaves) sh.layer(1.1, (t, v) => leaves(t, v, { n: o.leaves, speed: ws * 0.7 }), { front: true });
  if (o.rain) sh.layer(0.9, (t, v) => F2.bg.rain(t, v, { n: 90, color: '#C8D3EE', op: 0.5 }), { front: true });
  if (o.grass !== false) sh.layer(1.45, (t, v) => grassFG(t, v, o.grassStr || 1, o.grassOp ? o.grassOp(t) : 1), { blur: 5 });
}

  return [h[0] + lerp(-170, 120, k) + b[0] * k, lerp(Math.min(G - 30, h[1] + 60), h[1] - 470, k) + b[1] * k, lerp(-60, -12, k) + b[2] * k];
};
s25.custom((t) => { const [x, y, r] = kite25(t); return kiteString(handR(k25, t), bridle(x, y, r, 0.66), t < 126.8 ? 0.03 : 0.08) + kite(t, x, y, r, 0.66, { patches: 3, torn: true, bows: 4, wave: 1.2, drift: 3 }); }, 'front');
s25.cam.follow(126.0, 129.8, k25, { dx: 60, lag: 0.4 }).frame(129.6, 1.8, [100, -110, 1000, 1000], 'quintInOut');
film.cue('sfx', 126.8, { name: 'whoosh', gain: 0.26, pan: 0.2 }).cue('sfx', 128.3, { name: 'flap', gain: 0.18, pan: 0.4 }).cue('sfx', 130.0, { name: 'flap', gain: 0.15, pan: 0.5 });
const k25end = kite25(B(159));
film.cut(B(159), 'match', { from: [k25end[0], k25end[1]], to: [-40, -150] });

/* SHOT 26 · it soars (B159 → B163) */
const s26 = film.shot(B(159), B(163), { name: 'soar', frame: [20, -170, 760, 760], groundLine: false });
s26.layer(0.15, (t, v) => sunAt(t, 300, -330, 1.5));

s26.layer(0.75, (t, v) => F2.bg.clouds(t + 9, v, { n: 3, y: 60, speed: 110 }));

const kite26 = (t) => { const k = clamp((t - 132.5) / 3.4), b = bob(t, 26); return [lerp(-40, 120, E.sineInOut(k)) + b[0], lerp(-150, -250, E.sineInOut(k)) + b[1], -14 + b[2]]; };
s26.custom((t) => { const [x, y, r] = kite26(t), K = bridle(x, y, r, 1.05); return kiteString(K, [K[0] - 520, K[1] + 1100], -0.04, 3) + kite(t, x, y, r, 1.05, { patches: 3, torn: true, bows: 4, wave: 1.1, drift: 3 }); }, 'front');
s26.cam.frame(132.6, 3.2, [60, -200, 900, 900], 'sineInOut');

/* ===================== ACT 5 · IN THE WIND ===================== */

/* SHOT 27 · he hands the string to a child (B163 → B171) */

kid27.walk(135.9, 138.0, 210).look(137.9, [2, -6]).expr(138.0, 'excited').look(138.9, [-4, -1]).walk(139.1, 139.8, 120).face(140.3, 1).pose(140.3, 'kiteHold', { dur: 0.3, expr: 'excited' }).look(140.6, [3, -6]).expr(141.6, 'happy');
k27.look(137.4, [4, 0]).expr(138.2, 'happy').pose(138.9, 'handOver', { dur: 0.5, expr: 'soft' }).look(139.1, [4, 1]).pose(141.0, 'idle', { dur: 0.6, expr: 'happy' }).look(141.2, [3, -5]);

s27.tint(135.8, 0, C.ochre, 0.1).tint(136, 6, C.ochre, 0.16);
s27.cam.push(136.0, 6.4, 1.08, [80, 80]);
film.cue('sfx', 140.3, { name: 'pluck', gain: 0.12, note: 76 });

/* SHOT 28 · final wide: "Let it lift you." (B171 → end) */
const s28 = film.shot(B(171), DUR, { name: 'end', frame: [0, 20, 950, 950], groundLine: false });

const kite28 = (t) => { const b = bob(t, 28); return [210 + b[0], -260 + b[1], -12 + b[2]]; };
s28.custom((t) => { const [x, y, r] = kite28(t); return kiteString(handR(kid28, t), bridle(x, y, r, 0.45), 0.12, 2) + kite(t, x, y, r, 0.45, { patches: 3, torn: true, bows: 4 }); }, 'front');
s28.tint(142.5, 0, C.ochre, 0.18);
s28.cam.frame(142.6, 7.3, [20, -30, 1150, 1150], 'sineInOut');
